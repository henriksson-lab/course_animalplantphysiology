<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Short-day and long-day plants under night breaks</title><desc id="desc">Bars show 24-hour cycles of light and dark. Short-day plants flower with 8 h light and a 16 h night but not with 16 h light. A red flash in the middle of the long night stops short-day plants and lets long-day plants flower; far-red straight after the red cancels its effect.</desc><g font-family="Arial, sans-serif"><text x="390" y="40" font-size="23" fill="#243645" text-anchor="middle" font-weight="bold">24-hour cycle</text><text x="635" y="40" font-size="24" fill="#243645" text-anchor="middle" font-weight="bold">SDP</text><text x="735" y="40" font-size="24" fill="#243645" text-anchor="middle" font-weight="bold">LDP</text><text x="235.0" y="66" font-size="20" fill="#5b6b78" text-anchor="middle" font-weight="normal">0 h</text><text x="338.3333333333333" y="66" font-size="20" fill="#5b6b78" text-anchor="middle" font-weight="normal">8 h</text><text x="441.66666666666663" y="66" font-size="20" fill="#5b6b78" text-anchor="middle" font-weight="normal">16 h</text><text x="545.0" y="66" font-size="20" fill="#5b6b78" text-anchor="middle" font-weight="normal">24 h</text><text x="15" y="112" font-size="22" fill="#243645" text-anchor="start" font-weight="bold">Long day</text><rect x="235.0" y="82" width="206.66666666666663" height="42" rx="0" fill="#f2c45a" stroke="#243645" stroke-width="2"/><rect x="441.66666666666663" y="82" width="103.33333333333337" height="42" rx="0" fill="#243645" stroke="#243645" stroke-width="2"/><text x="635" y="112" font-size="22" fill="#8a959e" text-anchor="middle" font-weight="normal">no</text><text x="735" y="112" font-size="22" fill="#397646" text-anchor="middle" font-weight="bold">flowers</text><text x="15" y="184" font-size="22" fill="#243645" text-anchor="start" font-weight="bold">Short day</text><rect x="235.0" y="154" width="103.33333333333331" height="42" rx="0" fill="#f2c45a" stroke="#243645" stroke-width="2"/><rect x="338.3333333333333" y="154" width="206.66666666666669" height="42" rx="0" fill="#243645" stroke="#243645" stroke-width="2"/><text x="635" y="184" font-size="22" fill="#397646" text-anchor="middle" font-weight="bold">flowers</text><text x="735" y="184" font-size="22" fill="#8a959e" text-anchor="middle" font-weight="normal">no</text><text x="15" y="256" font-size="22" fill="#243645" text-anchor="start" font-weight="bold">Night break: red</text><rect x="235.0" y="226" width="103.33333333333331" height="42" rx="0" fill="#f2c45a" stroke="#243645" stroke-width="2"/><rect x="338.3333333333333" y="226" width="206.66666666666669" height="42" rx="0" fill="#243645" stroke="#243645" stroke-width="2"/><rect x="436.5" y="218" width="10.333333333333371" height="58" rx="0" fill="#b64853" stroke="white" stroke-width="1.5"/><text x="635" y="256" font-size="22" fill="#8a959e" text-anchor="middle" font-weight="normal">no</text><text x="735" y="256" font-size="22" fill="#397646" text-anchor="middle" font-weight="bold">flowers</text><text x="15" y="328" font-size="22" fill="#243645" text-anchor="start" font-weight="bold">Red, then far-red</text><rect x="235.0" y="298" width="103.33333333333331" height="42" rx="0" fill="#f2c45a" stroke="#243645" stroke-width="2"/><rect x="338.3333333333333" y="298" width="206.66666666666669" height="42" rx="0" fill="#243645" stroke="#243645" stroke-width="2"/><rect x="431.33333333333337" y="290" width="10.333333333333258" height="58" rx="0" fill="#b64853" stroke="white" stroke-width="1.5"/><rect x="441.66666666666663" y="290" width="10.333333333333371" height="58" rx="0" fill="#7a2b3a" stroke="white" stroke-width="1.5"/><text x="635" y="328" font-size="22" fill="#397646" text-anchor="middle" font-weight="bold">flowers</text><text x="735" y="328" font-size="22" fill="#8a959e" text-anchor="middle" font-weight="normal">no</text><text x="405" y="392" font-size="21" fill="#243645" text-anchor="middle" font-weight="normal">Critical night ≈ 11 h. A red flash splits the 16 h night into two 8 h nights;</text><text x="405" y="422" font-size="21" fill="#243645" text-anchor="middle" font-weight="normal">far-red straight after cancels it (phytochrome).</text></g></svg>
