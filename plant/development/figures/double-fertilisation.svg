<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Double fertilisation in flowering plants</title><desc id="desc">The pollen tube enters the ovule and releases two sperm cells. One fuses with the egg to form the diploid zygote; the other fuses with the central cell and its two polar nuclei to form the triploid endosperm.</desc><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal">Two sperm cells, two fusions</text><ellipse cx="330" cy="235" rx="230" ry="165" fill="#f3e8df" stroke="#b37a22" stroke-width="3" transform="rotate(0 330 235)"/><ellipse cx="340" cy="235" rx="175" ry="110" fill="#fff4df" stroke="#b37a22" stroke-width="3" transform="rotate(0 340 235)"/><text x="330" y="108" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="bold">ovule (maternal tissue)</text><text x="350" y="165" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="normal">embryo sac</text><path d="M 15 236 C 80 236 120 236 172 236" fill="none" stroke="#397646" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><text x="55" y="280" font-size="22" fill="#397646" text-anchor="middle" font-weight="bold">pollen</text><text x="55" y="306" font-size="22" fill="#397646" text-anchor="middle" font-weight="bold">tube</text><circle cx="186" cy="214" r="9" fill="#397646" stroke="#397646" stroke-width="3"/><circle cx="186" cy="258" r="9" fill="#397646" stroke="#397646" stroke-width="3"/><circle cx="228" cy="236" r="24" fill="#d6e3ef" stroke="#267a91" stroke-width="3"/><text x="228" y="243" font-size="18" fill="#267a91" text-anchor="middle" font-weight="bold">egg</text><circle cx="330" cy="220" r="14" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><circle cx="362" cy="248" r="14" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="360" y="300" font-size="22" fill="#b64853" text-anchor="middle" font-weight="bold">central cell</text><text x="360" y="324" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">2 polar nuclei</text><path d="M 192 206 C 196 190 205 196 212 214" fill="none" stroke="#397646" stroke-width="3" stroke-dasharray=""/><path d="M 212 214 l -13 -7 l 0 14 Z" fill="#397646" transform="rotate(68.7 212 214)"/><path d="M 194 266 C 240 300 300 290 345 258" fill="none" stroke="#397646" stroke-width="3" stroke-dasharray=""/><path d="M 345 258 l -13 -7 l 0 14 Z" fill="#397646" transform="rotate(-35.4 345 258)"/><rect x="570" y="85" width="220" height="120" rx="10" fill="#d6e3ef" stroke="#267a91" stroke-width="3"/><text x="680" y="120" font-size="22" fill="#267a91" text-anchor="middle" font-weight="bold">sperm 1 + egg</text><text x="680" y="150" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">→ zygote (2n)</text><text x="680" y="180" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">→ embryo</text><rect x="570" y="245" width="220" height="120" rx="10" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="680" y="280" font-size="22" fill="#b64853" text-anchor="middle" font-weight="bold">sperm 2 +</text><text x="680" y="310" font-size="22" fill="#b64853" text-anchor="middle" font-weight="bold">central cell</text><text x="680" y="340" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">→ endosperm (3n)</text><text x="330" y="428" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Seed coat and fruit wall stay maternal (2n).</text></g></svg>
