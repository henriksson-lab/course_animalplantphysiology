<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Photorespiration crosses chloroplast, peroxisome and mitochondrion</title><desc id="desc">Rubisco oxygenates RuBP to 3-PGA and 2-phosphoglycolate. Glycolate goes to the peroxisome and becomes glycine. In the mitochondrion two glycines give serine, CO2 and NH3. Serine returns via the peroxisome as glycerate, which re-enters the Calvin-Benson cycle as 3-PGA.</desc><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal">Rubisco + O₂: the salvage route crosses three organelles</text><rect x="15" y="60" width="255" height="330" rx="30" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="142" y="95" font-size="24" fill="#397646" text-anchor="middle" font-weight="bold">Chloroplast</text><rect x="290" y="60" width="220" height="330" rx="30" fill="#fff4df" stroke="#b37a22" stroke-width="3"/><text x="400" y="95" font-size="24" fill="#b37a22" text-anchor="middle" font-weight="bold">Peroxisome</text><rect x="530" y="60" width="255" height="330" rx="30" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="657" y="95" font-size="24" fill="#b64853" text-anchor="middle" font-weight="bold">Mitochondrion</text><text x="142" y="145" font-size="24" fill="#243645" text-anchor="middle" font-weight="bold">RuBP + O₂</text><line x1="142" y1="155" x2="142" y2="190" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 142 190 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(90.0 142 190)"/><text x="152" y="180" font-size="22" fill="#397646" text-anchor="start" font-weight="normal">Rubisco</text><text x="142" y="218" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">2-phospho-</text><text x="142" y="242" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">glycolate</text><text x="142" y="270" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">+ 3-PGA</text><line x1="205" y1="230" x2="345" y2="160" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 345 160 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(-26.6 345 160)"/><text x="400" y="150" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">glycolate</text><line x1="400" y1="160" x2="400" y2="195" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 400 195 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(90.0 400 195)"/><text x="400" y="218" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">glycine</text><line x1="445" y1="212" x2="590" y2="160" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 590 160 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(-19.7 590 160)"/><text x="657" y="150" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">2 glycine</text><line x1="657" y1="160" x2="657" y2="195" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 657 195 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(90.0 657 195)"/><text x="657" y="220" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">serine</text><text x="657" y="262" font-size="24" fill="#b64853" text-anchor="middle" font-weight="bold">+ CO₂ lost</text><text x="657" y="292" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">+ NH₃ to refix</text><line x1="600" y1="228" x2="450" y2="300" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 450 300 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(154.4 450 300)"/><text x="400" y="320" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">glycerate</text><line x1="340" y1="315" x2="245" y2="340" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 245 340 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(165.3 245 340)"/><text x="142" y="340" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">3-PGA → Calvin</text><text x="142" y="366" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">cycle</text><text x="400" y="425" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Of 4 carbons in 2 glycolate, 3 return and 1 is lost as CO₂.</text></g></svg>
