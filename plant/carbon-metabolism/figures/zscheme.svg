<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The Z-scheme of linear electron flow</title><desc id="desc">Electrons from water are lifted by light at photosystem II (P680), pass downhill through plastoquinone, cytochrome b6f (which pumps protons) and plastocyanin to photosystem I (P700), are lifted again by light, and pass through ferredoxin and FNR to reduce NADP+ to NADPH.</desc><g font-family="Arial, sans-serif"><text x="430" y="32" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal">Light lifts each electron twice: the Z-scheme</text><line x1="28" y1="425" x2="28" y2="70" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 28 70 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(-90.0 28 70)"/><text x="18" y="250" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" transform="rotate(-90 18 250)">Electron energy</text><path d="M 150 115 L 240 165 L 330 220 L 420 275 L 500 320" fill="none" stroke="#267a91" stroke-width="4" stroke-linejoin="round"/><path d="M 500 70 L 590 118 L 660 165" fill="none" stroke="#267a91" stroke-width="4" stroke-linejoin="round"/><line x1="660" y1="165" x2="712" y2="198" stroke="#267a91" stroke-width="4" stroke-dasharray=""/><path d="M 712 198 l -13.0 -7.0 l 0 14.0 Z" fill="#267a91" transform="rotate(32.4 712 198)"/><line x1="150" y1="365" x2="150" y2="128" stroke="#b37a22" stroke-width="7" stroke-dasharray=""/><path d="M 150 128 l -13.0 -7.0 l 0 14.0 Z" fill="#b37a22" transform="rotate(-90.0 150 128)"/><text x="132" y="250" font-size="24" fill="#b37a22" text-anchor="end" font-weight="normal">light</text><line x1="500" y1="310" x2="500" y2="84" stroke="#b37a22" stroke-width="7" stroke-dasharray=""/><path d="M 500 84 l -13.0 -7.0 l 0 14.0 Z" fill="#b37a22" transform="rotate(-90.0 500 84)"/><text x="482" y="200" font-size="24" fill="#b37a22" text-anchor="end" font-weight="normal">light</text><circle cx="240" cy="165" r="11" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="330" cy="220" r="11" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="420" cy="275" r="11" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="590" cy="118" r="11" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="660" cy="165" r="11" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="150" cy="372" r="16" fill="#e2eedf" stroke="#397646" stroke-width="3"/><circle cx="150" cy="115" r="13" fill="#e2eedf" stroke="#397646" stroke-width="3"/><circle cx="500" cy="320" r="16" fill="#e2eedf" stroke="#397646" stroke-width="3"/><circle cx="500" cy="70" r="13" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="165" y="102" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">P680*</text><text x="515" y="60" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">P700*</text><text x="150" y="412" font-size="24" fill="#397646" text-anchor="middle" font-weight="bold">P680</text><text x="150" y="436" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">photosystem II</text><text x="500" y="360" font-size="24" fill="#397646" text-anchor="middle" font-weight="bold">P700</text><text x="500" y="384" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">photosystem I</text><line x1="65" y1="372" x2="128" y2="372" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 128 372 l -13.0 -7.0 l 0 14.0 Z" fill="#267a91" transform="rotate(0.0 128 372)"/><text x="60" y="352" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">H₂O</text><text x="60" y="405" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">→ O₂</text><text x="254" y="152" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">PQ</text><text x="345" y="208" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">cyt b₆f</text><text x="318" y="255" font-size="22" fill="#b64853" text-anchor="end" font-weight="normal">pumps H⁺</text><text x="435" y="268" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">PC</text><text x="604" y="106" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">Fd</text><text x="675" y="156" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">FNR</text><text x="712" y="236" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">NADP⁺</text><text x="712" y="262" font-size="22" fill="#397646" text-anchor="middle" font-weight="bold">→ NADPH</text></g></svg>
