<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Proton gradient and ATP synthase in the thylakoid membrane</title><desc id="desc">Water splitting at photosystem II and pumping by cytochrome b6f fill the lumen with protons (pH about 5 against pH about 8 in the stroma). Protons flow back through ATP synthase, which makes ATP on the stroma side. Photosystem I reduces NADP+ to NADPH; in cyclic flow electrons return from PSI to cytochrome b6f.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="800" height="180" rx="0" fill="#fff4df" stroke="none" stroke-width="0"/><rect x="0" y="232" width="800" height="208" rx="0" fill="#f5dadd" stroke="none" stroke-width="0"/><rect x="0" y="180" width="800" height="52" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="2"/><text x="12" y="68" font-size="24" fill="#243645" text-anchor="start" font-weight="bold">Stroma: pH ~8</text><text x="12" y="428" font-size="24" fill="#b64853" text-anchor="start" font-weight="bold">Lumen: pH ~5 (1000× more H⁺)</text><rect x="70" y="165" width="100" height="82" rx="10" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="120" y="215" font-size="24" fill="#397646" text-anchor="middle" font-weight="bold">PSII</text><rect x="235" y="165" width="100" height="82" rx="10" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="266" y="215" font-size="24" fill="#397646" text-anchor="middle" font-weight="bold">b₆f</text><rect x="385" y="165" width="100" height="82" rx="10" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="435" y="215" font-size="24" fill="#397646" text-anchor="middle" font-weight="bold">PSI</text><line x1="170" y1="206" x2="233" y2="206" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 233 206 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(0.0 233 206)"/><line x1="335" y1="206" x2="383" y2="206" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 383 206 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(0.0 383 206)"/><line x1="105" y1="80" x2="112" y2="160" stroke="#b37a22" stroke-width="5" stroke-dasharray=""/><path d="M 112 160 l -13.0 -7.0 l 0 14.0 Z" fill="#b37a22" transform="rotate(85.0 112 160)"/><text x="118" y="104" font-size="22" fill="#b37a22" text-anchor="start" font-weight="normal">light</text><line x1="470" y1="80" x2="463" y2="160" stroke="#b37a22" stroke-width="5" stroke-dasharray=""/><path d="M 463 160 l -13.0 -7.0 l 0 14.0 Z" fill="#b37a22" transform="rotate(95.0 463 160)"/><text x="480" y="104" font-size="22" fill="#b37a22" text-anchor="start" font-weight="normal">light</text><text x="120" y="290" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">2H₂O → O₂ + 4H⁺</text><line x1="312" y1="140" x2="312" y2="300" stroke="#b64853" stroke-width="4" stroke-dasharray=""/><path d="M 312 300 l -13.0 -7.0 l 0 14.0 Z" fill="#b64853" transform="rotate(90.0 312 300)"/><text x="322" y="320" font-size="24" fill="#b64853" text-anchor="start" font-weight="normal">H⁺</text><text x="302" y="140" font-size="24" fill="#b64853" text-anchor="end" font-weight="normal">H⁺</text><line x1="485" y1="172" x2="545" y2="130" stroke="#397646" stroke-width="3" stroke-dasharray=""/><path d="M 545 130 l -13.0 -7.0 l 0 14.0 Z" fill="#397646" transform="rotate(-35.0 545 130)"/><text x="552" y="128" font-size="24" fill="#397646" text-anchor="start" font-weight="bold">NADPH</text><path d="M 420 162 C 410 95 345 95 330 160" fill="none" stroke="#397646" stroke-width="3" stroke-dasharray="8 6"/><path d="M 330 160 l -13.0 -7.0 l 0 14.0 Z" fill="#397646" transform="rotate(103.0 330 160)"/><text x="378" y="82" font-size="22" fill="#397646" text-anchor="middle" font-weight="bold">cyclic</text><rect x="655" y="168" width="70" height="76" rx="8" fill="#d6e3ef" stroke="#267a91" stroke-width="3"/><rect x="681" y="120" width="18" height="50" rx="3" fill="#d6e3ef" stroke="#267a91" stroke-width="3"/><circle cx="690" cy="104" r="34" fill="#d6e3ef" stroke="#267a91" stroke-width="3"/><text x="690" y="284" font-size="22" fill="#267a91" text-anchor="middle" font-weight="bold">ATP synthase</text><line x1="625" y1="360" x2="678" y2="250" stroke="#b64853" stroke-width="4" stroke-dasharray=""/><path d="M 678 250 l -13.0 -7.0 l 0 14.0 Z" fill="#b64853" transform="rotate(-64.3 678 250)"/><text x="615" y="384" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">H⁺ flows back</text><text x="690" y="60" font-size="22" fill="#243645" text-anchor="middle" font-weight="bold">ADP + Pᵢ → ATP</text><text x="80" y="360" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">H⁺</text><text x="200" y="380" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">H⁺</text><text x="350" y="370" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">H⁺</text><text x="470" y="340" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">H⁺</text><text x="420" y="300" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">H⁺</text></g></svg>
