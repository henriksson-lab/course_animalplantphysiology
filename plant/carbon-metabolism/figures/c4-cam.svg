<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">C4 separates CO2 fixation in space, CAM in time</title><desc id="desc">In C4 plants PEP carboxylase in mesophyll cells makes malate, which moves to bundle-sheath cells where CO2 is released to Rubisco. In CAM plants stomata open at night and malate is stored in the vacuole; by day stomata close and the malate releases CO2 to Rubisco in the same cell.</desc><g font-family="Arial, sans-serif"><text x="200" y="32" font-size="25" fill="#397646" text-anchor="middle" font-weight="bold">C4: separated in space</text><text x="600" y="32" font-size="25" fill="#267a91" text-anchor="middle" font-weight="bold">CAM: separated in time</text><line x1="400" y1="15" x2="400" y2="380" stroke="#9aa5ad" stroke-width="2" stroke-dasharray="6 6"/><rect x="15" y="100" width="180" height="230" rx="14" fill="#e2eedf" stroke="#397646" stroke-width="3"/><rect x="210" y="100" width="180" height="230" rx="14" fill="#c6dcc4" stroke="#397646" stroke-width="3"/><text x="105" y="360" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">mesophyll</text><text x="300" y="360" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">bundle sheath</text><line x1="105" y1="52" x2="105" y2="125" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 105 125 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(90.0 105 125)"/><text x="120" y="75" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">CO₂</text><text x="105" y="160" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">PEP</text><text x="105" y="186" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">carboxylase</text><line x1="105" y1="196" x2="105" y2="235" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 105 235 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(90.0 105 235)"/><text x="105" y="262" font-size="23" fill="#243645" text-anchor="middle" font-weight="bold">malate</text><line x1="150" y1="255" x2="228" y2="255" stroke="#b37a22" stroke-width="4" stroke-dasharray=""/><path d="M 228 255 l -13.0 -7.0 l 0 14.0 Z" fill="#b37a22" transform="rotate(0.0 228 255)"/><text x="300" y="140" font-size="23" fill="#243645" text-anchor="middle" font-weight="bold">malate</text><line x1="300" y1="150" x2="300" y2="180" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 300 180 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(90.0 300 180)"/><text x="300" y="205" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">CO₂ → Rubisco</text><text x="300" y="235" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Calvin cycle</text><text x="300" y="282" font-size="22" fill="#b64853" text-anchor="middle" font-weight="bold">high CO₂</text><rect x="410" y="100" width="180" height="230" rx="14" fill="#243645" stroke="#243645" stroke-width="3"/><rect x="610" y="100" width="180" height="230" rx="14" fill="#fff4df" stroke="#b37a22" stroke-width="3"/><text x="500" y="360" font-size="22" fill="#243645" text-anchor="middle" font-weight="bold">night</text><text x="700" y="360" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="bold">day</text><circle cx="560" cy="130" r="13" fill="#f4f5f6" stroke="#f4f5f6" stroke-width="3"/><circle cx="566" cy="125" r="12" fill="#243645" stroke="#243645" stroke-width="0"/><text x="500" y="165" font-size="22" fill="white" text-anchor="middle" font-weight="normal">stomata open</text><text x="500" y="205" font-size="22" fill="white" text-anchor="middle" font-weight="normal">CO₂ → PEPC</text><line x1="500" y1="213" x2="500" y2="240" stroke="white" stroke-width="3" stroke-dasharray=""/><path d="M 500 240 l -13.0 -7.0 l 0 14.0 Z" fill="white" transform="rotate(90.0 500 240)"/><text x="500" y="268" font-size="22" fill="white" text-anchor="middle" font-weight="bold">malate stored</text><text x="500" y="294" font-size="22" fill="white" text-anchor="middle" font-weight="normal">in vacuole</text><circle cx="763" cy="128" r="14" fill="#f2c45a" stroke="#b37a22" stroke-width="3"/><text x="700" y="165" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">stomata closed</text><text x="700" y="205" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">malate → CO₂</text><line x1="700" y1="213" x2="700" y2="240" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 700 240 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(90.0 700 240)"/><text x="700" y="268" font-size="22" fill="#243645" text-anchor="middle" font-weight="bold">Rubisco</text><text x="700" y="294" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Calvin cycle</text><line x1="595" y1="255" x2="625" y2="255" stroke="#b37a22" stroke-width="4" stroke-dasharray=""/><path d="M 625 255 l -13.0 -7.0 l 0 14.0 Z" fill="#b37a22" transform="rotate(0.0 625 255)"/><text x="400" y="418" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Same two enzymes in both: PEP carboxylase first, Rubisco last.</text></g></svg>
