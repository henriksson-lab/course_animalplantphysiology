<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Independent transgenic lines and controls</title><desc id="desc">Five chromosomes. Wild type has no insert and is normal. Lines 1, 2 and 3 have the transgene at three different positions and all show the same new phenotype. An empty-vector line has an insert without the gene and is normal.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="34" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Several independent lines separate the gene from the insertion</text><text x="390" y="72" font-size="21" fill="#8a949c" text-anchor="middle" font-weight="normal" font-style="normal">Chromosome with insertion site</text><text x="700" y="72" font-size="21" fill="#8a949c" text-anchor="middle" font-weight="normal" font-style="normal">Phenotype</text><text x="20" y="113" font-size="22" fill="#243645" text-anchor="start" font-weight="normal" font-style="normal">Wild type</text><rect x="200" y="95" width="380" height="20" rx="10" fill="#f1f3f4" stroke="#243645" stroke-width="2"/><rect x="230" y="95" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="330" y="95" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="470" y="95" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><text x="700" y="113" font-size="23" fill="#397646" text-anchor="middle" font-weight="normal" font-style="normal">normal</text><text x="20" y="175" font-size="22" fill="#243645" text-anchor="start" font-weight="normal" font-style="normal">Line 1</text><rect x="200" y="157" width="380" height="20" rx="10" fill="#f1f3f4" stroke="#243645" stroke-width="2"/><rect x="230" y="157" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="330" y="157" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="470" y="157" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="266" y="145" width="28" height="44" rx="4" fill="#b64853" stroke="#b64853" stroke-width="2"/><text x="700" y="175" font-size="23" fill="#b64853" text-anchor="middle" font-weight="bold" font-style="normal">new</text><text x="20" y="237" font-size="22" fill="#243645" text-anchor="start" font-weight="normal" font-style="normal">Line 2</text><rect x="200" y="219" width="380" height="20" rx="10" fill="#f1f3f4" stroke="#243645" stroke-width="2"/><rect x="230" y="219" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="330" y="219" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="470" y="219" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="416" y="207" width="28" height="44" rx="4" fill="#b64853" stroke="#b64853" stroke-width="2"/><text x="700" y="237" font-size="23" fill="#b64853" text-anchor="middle" font-weight="bold" font-style="normal">new</text><text x="20" y="299" font-size="22" fill="#243645" text-anchor="start" font-weight="normal" font-style="normal">Line 3</text><rect x="200" y="281" width="380" height="20" rx="10" fill="#f1f3f4" stroke="#243645" stroke-width="2"/><rect x="230" y="281" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="330" y="281" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="470" y="281" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="526" y="269" width="28" height="44" rx="4" fill="#b64853" stroke="#b64853" stroke-width="2"/><text x="700" y="299" font-size="23" fill="#b64853" text-anchor="middle" font-weight="bold" font-style="normal">new</text><text x="20" y="361" font-size="22" fill="#243645" text-anchor="start" font-weight="normal" font-style="normal">Empty vector</text><rect x="200" y="343" width="380" height="20" rx="10" fill="#f1f3f4" stroke="#243645" stroke-width="2"/><rect x="230" y="343" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="330" y="343" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="470" y="343" width="30" height="20" rx="2" fill="#c7d9df" stroke="#267a91" stroke-width="1"/><rect x="336" y="331" width="28" height="44" rx="4" fill="#d0d4d8" stroke="#8a949c" stroke-width="2"/><text x="700" y="361" font-size="23" fill="#397646" text-anchor="middle" font-weight="normal" font-style="normal">normal</text><text x="400" y="420" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Only the transgene is common to lines 1–3</text></g></svg>
