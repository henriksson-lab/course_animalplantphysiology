<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Binary vector and helper Ti plasmid</title><desc id="desc">An Agrobacterium cell carries a small binary vector whose T-DNA region holds a selectable marker and the gene of interest between the left and right borders, plus a disarmed helper Ti plasmid that supplies the vir genes.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="34" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">A binary vector: our gene between the T-DNA borders</text><rect x="30" y="55" width="740" height="190" rx="90" fill="#f7f9fa" stroke="#243645" stroke-width="3"/><text x="80" y="95" font-size="23" fill="#243645" text-anchor="start" font-weight="normal" font-style="italic">Agrobacterium</text><circle cx="250" cy="150" r="58" fill="none" stroke="#267a91" stroke-width="5"/><path d="M 209 191 A 58 58 0 0 0 291 191" fill="none" stroke="#b64853" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="145" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal" font-style="normal">binary</text><text x="250" y="170" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal" font-style="normal">vector</text><text x="250" y="238" font-size="20" fill="#b64853" text-anchor="middle" font-weight="bold" font-style="normal">T-DNA</text><circle cx="560" cy="155" r="62" fill="none" stroke="#8a949c" stroke-width="5"/><path d="M 498 155 A 62 62 0 0 1 560 93" fill="none" stroke="#b37a22" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><text x="620" y="90" font-size="22" fill="#b37a22" text-anchor="start" font-weight="normal" font-style="normal">vir genes</text><text x="560" y="152" font-size="22" fill="#8a949c" text-anchor="middle" font-weight="normal" font-style="normal">disarmed</text><text x="560" y="177" font-size="22" fill="#8a949c" text-anchor="middle" font-weight="normal" font-style="normal">Ti plasmid</text><line x1="209" y1="191" x2="60" y2="300" stroke="#b64853" stroke-width="2" stroke-dasharray="6 5"/><line x1="291" y1="191" x2="740" y2="300" stroke="#b64853" stroke-width="2" stroke-dasharray="6 5"/><line x1="60" y1="330" x2="740" y2="330" stroke="#243645" stroke-width="4" stroke-dasharray=""/><path d="M60 305 L80 330 L60 355 Z" fill="#b64853" stroke="#b64853" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M740 305 L720 330 L740 355 Z" fill="#b64853" stroke="#b64853" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="50" y="385" font-size="23" fill="#b64853" text-anchor="start" font-weight="bold" font-style="normal">LB</text><text x="750" y="385" font-size="23" fill="#b64853" text-anchor="end" font-weight="bold" font-style="normal">RB</text><rect x="110" y="308" width="230" height="44" rx="6" fill="#e1ebdc" stroke="#397646" stroke-width="3"/><text x="225" y="338" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal" font-style="normal">marker (nptII)</text><rect x="380" y="308" width="300" height="44" rx="6" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="530" y="338" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal" font-style="normal">promoter + our gene</text><text x="400" y="425" font-size="21" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">vir proteins cut at the borders; the T-DNA between them enters the plant genome</text></g></svg>
