<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Transgenesis compared with CRISPR editing</title><desc id="desc">Top: a T-DNA carrying foreign DNA lands at a random position in a chromosome and stays there. Bottom: Cas9 guided by a guide RNA cuts gene B at a chosen site; repair leaves a small insertion or deletion, and the Cas9 construct can be crossed out.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="60" y="52" font-size="25" fill="#243645" text-anchor="start" font-weight="bold" font-style="normal">Transgenesis</text><rect x="60" y="90" width="680" height="30" rx="15" fill="#f1f3f4" stroke="#243645" stroke-width="2"/><rect x="120" y="90" width="100" height="30" rx="3" fill="#c7d9df" stroke="#267a91" stroke-width="2"/><text x="148" y="113" font-size="20" fill="#267a91" text-anchor="middle" font-weight="bold" font-style="normal">A</text><rect x="430" y="90" width="100" height="30" rx="3" fill="#c7d9df" stroke="#267a91" stroke-width="2"/><text x="458" y="113" font-size="20" fill="#267a91" text-anchor="middle" font-weight="bold" font-style="normal">B</text><rect x="620" y="90" width="100" height="30" rx="3" fill="#c7d9df" stroke="#267a91" stroke-width="2"/><text x="648" y="113" font-size="20" fill="#267a91" text-anchor="middle" font-weight="bold" font-style="normal">C</text><rect x="290" y="70" width="80" height="70" rx="4" fill="#b64853" stroke="#b64853" stroke-width="2"/><text x="330" y="112" font-size="18" fill="white" text-anchor="middle" font-weight="bold" font-style="normal">T-DNA</text><text x="60" y="180" font-size="22" fill="#243645" text-anchor="start" font-weight="normal" font-style="normal">Foreign DNA inserted at a random site; it stays in the plant</text><text x="60" y="245" font-size="25" fill="#243645" text-anchor="start" font-weight="bold" font-style="normal">Genome editing (CRISPR–Cas9)</text><rect x="60" y="300" width="680" height="30" rx="15" fill="#f1f3f4" stroke="#243645" stroke-width="2"/><rect x="120" y="300" width="100" height="30" rx="3" fill="#c7d9df" stroke="#267a91" stroke-width="2"/><text x="148" y="323" font-size="20" fill="#267a91" text-anchor="middle" font-weight="bold" font-style="normal">A</text><rect x="430" y="300" width="100" height="30" rx="3" fill="#c7d9df" stroke="#267a91" stroke-width="2"/><text x="458" y="323" font-size="20" fill="#267a91" text-anchor="middle" font-weight="bold" font-style="normal">B</text><rect x="620" y="300" width="100" height="30" rx="3" fill="#c7d9df" stroke="#267a91" stroke-width="2"/><text x="648" y="323" font-size="20" fill="#267a91" text-anchor="middle" font-weight="bold" font-style="normal">C</text><ellipse cx="495" cy="268" rx="46" ry="24" fill="#fbf1df" stroke="#b37a22" stroke-width="3" transform="rotate(0 495 268)"/><text x="495" y="276" font-size="20" fill="#b37a22" text-anchor="middle" font-weight="bold" font-style="normal">Cas9</text><path d="M488 300 L498 316 L508 300" fill="none" stroke="#b64853" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="485" y1="254" x2="535" y2="254" stroke="#b64853" stroke-width="4" stroke-dasharray=""/><text x="560" y="258" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal" font-style="normal">guide RNA</text><text x="60" y="375" font-size="22" fill="#243645" text-anchor="start" font-weight="normal" font-style="normal">Guide RNA picks the site; repair leaves a small indel in gene B</text><text x="60" y="412" font-size="22" fill="#397646" text-anchor="start" font-weight="normal" font-style="normal">The Cas9 construct is then removed by crossing</text></g></svg>
