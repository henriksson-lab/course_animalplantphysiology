" fill="#243645" text-anchor="middle" font-weight="normal">ATP-driven H⁺ pump in membrane</text><text x="205" y="365" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">tethers hold microfibrils</text><text x="400" y="405" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Low wall pH activates expansins (red): tethers slip,</text><text x="400" y="433" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">and turgor stretches the wall irreversibly.</text></g></svg>
