<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Acid growth of the plant cell wall</title><desc id="desc">Cellulose microfibrils are held by matrix tethers. Pumping H+ into the wall lowers its pH, activating expansins that loosen the tethers so turgor can extend the wall.</desc><g font-family="Arial, sans-serif"><text x="205" y="34" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Neutral wall</text><text x="605" y="34" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Acidified wall</text><rect x="65" y="100" width="295" height="205" rx="4" fill="#f3e8df" stroke="#d8c3ae" stroke-width="2"/><line x1="100" y1="130" x2="145" y2="130" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="100" y1="187" x2="145" y2="187" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="100" y1="220" x2="145" y2="220" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="100" y1="277" x2="145" y2="277" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="155" y1="142" x2="200" y2="142" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="155" y1="175" x2="200" y2="175" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="155" y1="232" x2="200" y2="232" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="155" y1="265" x2="200" y2="265" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="210" y1="130" x2="255" y2="130" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="210" y1="187" x2="255" y2="187" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="210" y1="220" x2="255" y2="220" stroke="#b37a22" stroke-width="4" stroke-da