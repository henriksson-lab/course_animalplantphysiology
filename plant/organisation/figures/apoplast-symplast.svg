<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Apoplast and symplast</title><desc id="desc">Three plant cells share walls. The apoplastic route runs through the walls; the symplastic route runs through cytoplasm and plasmodesmata. Entering the symplast from the wall requires crossing a plasma membrane.</desc><g font-family="Arial, sans-serif"><text x="400" y="34" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Two routes between cells</text><rect x="40" y="95" width="720" height="215" rx="6" fill="#f3e8df" stroke="#d8c3ae" stroke-width="2"/><rect x="56" y="111" width="216" height="183" rx="10" fill="#e2eedf" stroke="#397646" stroke-width="3"/><rect x="76" y="140" width="176" height="88" rx="10" fill="#d8eaf0" stroke="#267a91" stroke-width="2"/><rect x="292" y="111" width="216" height="183" rx="10" fill="#e2eedf" stroke="#397646" stroke-width="3"/><rect x="312" y="140" width="176" height="88" rx="10" fill="#d8eaf0" stroke="#267a91" stroke-width="2"/><rect x="528" y="111" width="216" height="183" rx="10" fill="#e2eedf" stroke="#397646" stroke-width="3"/><rect x="548" y="140" width="176" height="88" rx="10" fill="#d8eaf0" stroke="#267a91" stroke-width="2"/><text x="144" y="192" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">vacuole</text><rect x="271" y="145" width="22" height="10" rx="3" fill="#e2eedf" stroke="#397646" stroke-width="2"/><rect x="271" y="257" width="22" height="10" rx="3" fill="#e2eedf" stroke="#397646" stroke-width="2"/><rect x="507" y="145" width="22" height="10" rx="3" fill="#e2eedf" stroke="#397646" stroke-width="2"/><rect x="507" y="257" width="22" height="10" rx="3" fill="#e2eedf" stroke="#397646" stroke-width="2"/><line x1="283" y1="144" x2="250" y2="88" stroke="#243645" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/><text x="245" y="80" font-size="22" fill="#243645" text-anchor="end" font-weight="normal">plasmodesma</text><line x1="48" y1="103" x2="745" y2="103" stroke="#267a91" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round"/><path d="M 745 103 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(0.0 745 103)"/><text x="700" y="80" font-size="23" fill="#267a91" text-anchor="middle" font-weight="bold">apoplast</text><line x1="90" y1="262" x2="735" y2="262" stroke="#397646" stroke-width="5" stroke-dasharray="" stroke-linecap="round"/><path d="M 735 262 l -14 -8 l 0 16 Z" fill="#397646" transform="rotate(0.0 735 262)"/><text x="400" y="250" font-size="23" fill="#397646" text-anchor="middle" font-weight="bold">symplast</text><line x1="400" y1="100" x2="400" y2="134" stroke="#b64853" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 400 134 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(90.0 400 134)"/><text x="415" y="80" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">crosses a membrane</text><text x="400" y="350" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">Apoplast: walls and spaces, outside every plasma membrane</text><text x="400" y="380" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">Symplast: cytoplasm joined through plasmodesmata</text><text x="400" y="410" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">Moving between them means crossing a membrane: the point of selection</text></g></svg>
