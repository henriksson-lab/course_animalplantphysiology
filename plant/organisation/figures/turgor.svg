<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Flaccid and turgid plant cells</title><desc id="desc">A flaccid cell has no turgor. After water enters the solute-rich vacuole, the protoplast presses outward on the wall and the wall resists, giving turgor pressure.</desc><g font-family="Arial, sans-serif"><text x="400" y="28" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Turgor: the vacuole swells, the wall pushes back</text><text x="185" y="70" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Flaccid: Ψp = 0</text><rect x="85" y="105" width="200" height="170" rx="10" fill="#f3e8df" stroke="#397646" stroke-width="7"/><rect x="91" y="111" width="188" height="158" rx="8" fill="#e2eedf" stroke="#397646" stroke-width="2"/><rect x="107" y="127" width="156" height="126" rx="8" fill="#d8eaf0" stroke="#267a91" stroke-width="2"/><text x="185" y="215" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">vacuole</text><line x1="320" y1="190" x2="410" y2="190" stroke="#267a91" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 410 190 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(0.0 410 190)"/><text x="365" y="170" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">water</text><text x="610" y="70" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Turgid: Ψp = 0.3–1 MPa</text><rect x="470" y="100" width="280" height="190" rx="10" fill="#f3e8df" stroke="#397646" stroke-width="7"/><rect x="476" y="106" width="268" height="178" rx="8" fill="#e2eedf" stroke="#397646" stroke-width="2"/><rect x="492" y="122" width="236" height="146" rx="8" fill="#d8eaf0" stroke="#267a91" stroke-width="2"/><text x="610" y="186" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">vacuole</text><text x="610" y="212" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">+ solutes</text><line x1="610" y1="240" x2="610" y2="280" stroke="#b64853" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 610 280 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(90.0 610 280)"/><line x1="610" y1="150" x2="610" y2="112" stroke="#b64853" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 610 112 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(-90.0 610 112)"/><line x1="520" y1="195" x2="480" y2="195" stroke="#b64853" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 480 195 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(180.0 480 195)"/><line x1="700" y1="195" x2="740" y2="195" stroke="#b64853" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 740 195 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(0.0 740 195)"/><line x1="610" y1="316" x2="610" y2="298" stroke="#397646" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 610 298 l -14 -8 l 0 16 Z" fill="#397646" transform="rotate(-90.0 610 298)"/><line x1="610" y1="80" x2="610" y2="95" stroke="#397646" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 610 95 l -14 -8 l 0 16 Z" fill="#397646" transform="rotate(90.0 610 95)"/><text x="610" y="335" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">red: turgor pushes out</text><text x="610" y="362" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">green: wall resists</text><text x="185" y="320" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">membrane just touches</text><text x="185" y="347" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">the wall; no pressure</text><text x="400" y="418" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Turgid cells pressing on each other make a leaf or stem rigid.</text></g></svg>
