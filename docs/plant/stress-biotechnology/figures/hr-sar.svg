<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Hypersensitive response and systemic acquired resistance</title><desc id="desc">A lower leaf shows small dead patches where the hypersensitive response killed infected cells. A signal travels through the phloem to uninfected upper leaves, which develop salicylic-acid-dependent systemic acquired resistance with PR proteins.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="36" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Local cell death, then resistance in the whole plant</text><path d="M330 430 C330 330 335 200 340 70" fill="none" stroke="#397646" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="200" cy="330" rx="125" ry="48" fill="#e1ebdc" stroke="#397646" stroke-width="3" transform="rotate(-12 200 330)"/><path d="M330 302 L80 356" fill="none" stroke="#397646" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="150" cy="330" r="14" fill="#7a4a2a" stroke="#4a2a17" stroke-width="2"/><circle cx="150" cy="330" r="22" fill="none" stroke="#b64853" stroke-width="2"/><circle cx="205" cy="318" r="14" fill="#7a4a2a" stroke="#4a2a17" stroke-width="2"/><circle cx="205" cy="318" r="22" fill="none" stroke="#b64853" stroke-width="2"/><circle cx="255" cy="335" r="14" fill="#7a4a2a" stroke="#4a2a17" stroke-width="2"/><circle cx="255" cy="335" r="22" fill="none" stroke="#b64853" stroke-width="2"/><circle cx="180" cy="355" r="14" fill="#7a4a2a" stroke="#4a2a17" stroke-width="2"/><circle cx="180" cy="355" r="22" fill="none" stroke="#b64853" stroke-width="2"/><ellipse cx="480" cy="220" rx="120" ry="42" fill="#e1ebdc" stroke="#397646" stroke-width="3" transform="rotate(10 480 220)"/><ellipse cx="200" cy="140" rx="110" ry="38" fill="#e1ebdc" stroke="#397646" stroke-width="3" transform="rotate(12 200 140)"/><path d="M337 190 L362 199" fill="none" stroke="#397646" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M307 163 L338 160" fill="none" stroke="#397646" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="480" y="228" font-size="23" fill="#397646" text-anchor="middle" font-weight="bold" font-style="normal">SAR</text><text x="200" y="148" font-size="23" fill="#397646" text-anchor="middle" font-weight="bold" font-style="normal">SAR</text><line x1="300" y1="300" x2="395" y2="245" stroke="#b64853" stroke-width="3" stroke-dasharray="8 6"/><path d="M 395 245 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(-30.068582821862453 395 245)"/><line x1="318" y1="270" x2="300" y2="175" stroke="#b64853" stroke-width="3" stroke-dasharray="8 6"/><path d="M 300 175 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(-100.72885929801006 300 175)"/><text x="80" y="410" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal" font-style="normal">Infected leaf: HR lesions</text><text x="560" y="300" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal" font-style="normal">Signal moves in</text><text x="560" y="327" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal" font-style="normal">the phloem; SA</text><text x="560" y="354" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal" font-style="normal">needed for SAR</text><text x="620" y="120" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal" font-style="normal">Uninfected leaves:</text><text x="620" y="147" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal" font-style="normal">PR proteins,</text><text x="620" y="174" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal" font-style="normal">broad resistance</text></g></svg>
