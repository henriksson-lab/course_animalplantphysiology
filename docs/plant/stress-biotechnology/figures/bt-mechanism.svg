<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">How Bt toxin kills a caterpillar</title><desc id="desc">Four steps: the larva eats the Cry protoxin; proteases in the alkaline gut activate it; the toxin binds specific receptors on gut epithelial cells; it forms pores and the cells lyse. Mammals have an acidic stomach and no receptor.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="34" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Bt toxin needs an alkaline gut and specific receptors</text><line x1="162" y1="150" x2="238" y2="150" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 238 150 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(0.0 238 150)"/><line x1="362" y1="150" x2="438" y2="150" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 438 150 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(0.0 438 150)"/><line x1="562" y1="150" x2="638" y2="150" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 638 150 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(0.0 638 150)"/><path d="M100 105 L140 150 L100 195 L60 150 Z" fill="#fbf1df" stroke="#b37a22" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M300 125 L325 150 L300 175 L275 150 Z" fill="#b37a22" stroke="#b37a22" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M262 108 l14 0 l-7 12 Z" fill="#d9dde0" stroke="#8a949c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M328 182 l14 0 l-7 12 Z" fill="#d9dde0" stroke="#8a949c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M330 112 l12 4 l-8 9 Z" fill="#d9dde0" stroke="#8a949c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="433" y="160" width="44" height="60" rx="4" fill="#f5dadd" stroke="#b64853" stroke-width="2"/><path d="M455 160 L455 145 M455 145 L447 135 M455 145 L463 135" fill="none" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="478" y="160" width="44" height="60" rx="4" fill="#f5dadd" stroke="#b64853" stroke-width="2"/><path d="M500 160 L500 145 M500 145 L492 135 M500 145 L508 135" fill="none" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="523" y="160" width="44" height="60" rx="4" fill="#f5dadd" stroke="#b64853" stroke-width="2"/><path d="M545 160 L545 145 M545 145 L537 135 M545 145 L553 135" fill="none" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M500 108 L516 124 L500 140 L484 124 Z" fill="#b37a22" stroke="#b37a22" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="668" y="120" width="64" height="80" rx="4" fill="#f5dadd" stroke="#b64853" stroke-width="2"/><rect x="692" y="112" width="16" height="40" rx="3" fill="white" stroke="#b37a22" stroke-width="3"/><line x1="685.0" y1="166.0" x2="650" y2="180" stroke="#b64853" stroke-width="2" stroke-dasharray=""/><path d="M 650 180 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(158.19859051364818 650 180)"/><line x1="715.0" y1="169.0" x2="750" y2="190" stroke="#b64853" stroke-width="2" stroke-dasharray=""/><path d="M 750 190 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(30.96375653207352 750 190)"/><line x1="686.5" y1="178.0" x2="655" y2="220" stroke="#b64853" stroke-width="2" stroke-dasharray=""/><path d="M 655 220 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(126.86989764584402 655 220)"/><line x1="714.4" y1="182.5" x2="748" y2="235" stroke="#b64853" stroke-width="2" stroke-dasharray=""/><path d="M 748 235 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(57.38075692880716 748 235)"/><text x="100" y="262" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Larva eats</text><text x="100" y="288" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">protoxin</text><text x="300" y="262" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Alkaline gut:</text><text x="300" y="288" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">proteases</text><text x="300" y="314" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">activate it</text><text x="500" y="262" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Binds gut</text><text x="500" y="288" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">receptors</text><text x="700" y="262" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Pores form,</text><text x="700" y="288" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">cells lyse</text><rect x="60" y="360" width="680" height="62" rx="6" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="400" y="399" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal" font-style="normal">Mammals: acidic stomach and no receptor, so no binding</text></g></svg>
