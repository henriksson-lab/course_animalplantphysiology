<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Sodium exclusion and vacuolar storage</title><desc id="desc">A root cell in salty soil. The SOS1 antiporter in the plasma membrane pumps sodium back out to the soil; the NHX antiporter in the vacuolar membrane moves sodium into the vacuole. The cytoplasm keeps a high potassium to sodium ratio.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="36" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Salt tolerance: keep Na⁺ out of the cytoplasm</text><rect x="10" y="60" width="160" height="320" rx="10" fill="#f4efe6" stroke="#b37a22" stroke-width="3"/><text x="90" y="95" font-size="23" fill="#b37a22" text-anchor="middle" font-weight="normal" font-style="normal">Salty soil</text><text x="45" y="230" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal" font-style="normal">Na⁺</text><text x="120" y="255" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal" font-style="normal">Na⁺</text><text x="50" y="300" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal" font-style="normal">Na⁺</text><text x="125" y="360" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal" font-style="normal">Na⁺</text><text x="45" y="365" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal" font-style="normal">Na⁺</text><rect x="200" y="70" width="420" height="300" rx="30" fill="#e1ebdc" stroke="#397646" stroke-width="3"/><text x="290" y="105" font-size="23" fill="#397646" text-anchor="middle" font-weight="normal" font-style="normal">Cytoplasm</text><rect x="390" y="115" width="200" height="215" rx="26" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="490" y="200" font-size="23" fill="#267a91" text-anchor="middle" font-weight="normal" font-style="normal">Vacuole</text><text x="490" y="235" font-size="23" fill="#b64853" text-anchor="middle" font-weight="normal" font-style="normal">Na⁺ stored</text><rect x="186" y="150" width="28" height="50" rx="6" fill="#b37a22" stroke="#b37a22" stroke-width="3"/><line x1="250" y1="175" x2="135" y2="175" stroke="#b64853" stroke-width="4" stroke-dasharray=""/><path d="M 135 175 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(180.0 135 175)"/><text x="240" y="160" font-size="22" fill="#243645" text-anchor="start" font-weight="bold" font-style="normal">SOS1</text><text x="100" y="135" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal" font-style="normal">Na⁺ out</text><rect x="376" y="250" width="28" height="50" rx="6" fill="#b37a22" stroke="#b37a22" stroke-width="3"/><line x1="320" y1="275" x2="440" y2="275" stroke="#b64853" stroke-width="4" stroke-dasharray=""/><path d="M 440 275 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(0.0 440 275)"/><text x="345" y="245" font-size="22" fill="#243645" text-anchor="middle" font-weight="bold" font-style="normal">NHX</text><line x1="140" y1="320" x2="255" y2="320" stroke="#8a949c" stroke-width="3" stroke-dasharray="7 5"/><path d="M 255 320 l -14 -8 l 0 16 Z" fill="#8a949c" transform="rotate(0.0 255 320)"/><text x="295" y="355" font-size="22" fill="#8a949c" text-anchor="middle" font-weight="normal" font-style="normal">Na⁺ leaks in</text><text x="710" y="110" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Both are</text><text x="710" y="137" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Na⁺/H⁺</text><text x="710" y="164" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">antiporters</text><text x="710" y="230" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal" font-style="normal">Cytoplasm</text><text x="710" y="257" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal" font-style="normal">keeps high</text><text x="710" y="284" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal" font-style="normal">K⁺ : Na⁺</text><text x="400" y="418" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Vacuolar Na⁺ also lowers ψs, so water still enters</text></g></svg>
