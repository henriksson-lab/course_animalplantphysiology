<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Plant transformation workflow</title><desc id="desc">Five steps: the gene goes into the T-DNA of a binary vector; explants such as leaf discs are infected with Agrobacterium; they are grown on a selective medium where only transformed tissue stays green; shoots are regenerated; insertion and expression are confirmed by PCR and RT-PCR.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="36" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">From construct to transgenic plant</text><line x1="143" y1="160" x2="187" y2="160" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 187 160 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(0.0 187 160)"/><line x1="303" y1="160" x2="342" y2="160" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 342 160 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(0.0 342 160)"/><line x1="458" y1="160" x2="497" y2="160" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 497 160 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(0.0 497 160)"/><line x1="613" y1="160" x2="657" y2="160" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 657 160 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(0.0 657 160)"/><circle cx="85" cy="160" r="45" fill="none" stroke="#267a91" stroke-width="5"/><path d="M 53 128 A 45 45 0 0 1 117 128" fill="none" stroke="#b64853" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="245" cy="175" rx="62" ry="28" fill="#f7f9fa" stroke="#243645" stroke-width="3" transform="rotate(0 245 175)"/><ellipse cx="245" cy="168" rx="62" ry="28" fill="#fdfdfd" stroke="#243645" stroke-width="3" transform="rotate(0 245 168)"/><circle cx="220" cy="165" r="12" fill="#e1ebdc" stroke="#397646" stroke-width="2"/><circle cx="248" cy="165" r="12" fill="#e1ebdc" stroke="#397646" stroke-width="2"/><circle cx="272" cy="165" r="12" fill="#e1ebdc" stroke="#397646" stroke-width="2"/><rect x="232" y="150" width="10" height="5" rx="2" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><rect x="262" y="180" width="10" height="5" rx="2" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><rect x="210" y="178" width="10" height="5" rx="2" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><rect x="283" y="155" width="10" height="5" rx="2" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><ellipse cx="400" cy="175" rx="62" ry="28" fill="#f7f9fa" stroke="#243645" stroke-width="3" transform="rotate(0 400 175)"/><ellipse cx="400" cy="168" rx="62" ry="28" fill="#fdfdfd" stroke="#243645" stroke-width="3" transform="rotate(0 400 168)"/><circle cx="372" cy="165" r="12" fill="#c9b08a" stroke="#8a6a3a" stroke-width="2"/><circle cx="428" cy="165" r="12" fill="#c9b08a" stroke="#8a6a3a" stroke-width="2"/><circle cx="400" cy="163" r="13" fill="#9cc48a" stroke="#397646" stroke-width="3"/><rect x="520" y="105" width="70" height="100" rx="8" fill="#f7f9fa" stroke="#243645" stroke-width="3"/><rect x="520" y="175" width="70" height="30" rx="4" fill="#f1ead2" stroke="#b37a22" stroke-width="3"/><path d="M555 175 L555 130" fill="none" stroke="#397646" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M555 145 C540 135 535 125 538 118 C548 122 553 132 555 145" fill="#e1ebdc" stroke="#397646" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M555 140 C570 130 575 120 572 113 C562 117 557 127 555 140" fill="#e1ebdc" stroke="#397646" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="670" y="110" width="90" height="100" rx="6" fill="#2f3d48" stroke="#243645" stroke-width="3"/><rect x="681" y="140" width="18" height="6" rx="1" fill="#e7f1f4" stroke="#e7f1f4" stroke-width="1"/><rect x="681" y="160" width="18" height="6" rx="1" fill="#e7f1f4" stroke="#e7f1f4" stroke-width="1"/><rect x="681" y="185" width="18" height="6" rx="1" fill="#e7f1f4" stroke="#e7f1f4" stroke-width="1"/><rect x="706" y="160" width="18" height="6" rx="1" fill="#e7f1f4" stroke="#e7f1f4" stroke-width="1"/><rect x="731" y="160" width="18" height="6" rx="1" fill="#e7f1f4" stroke="#e7f1f4" stroke-width="1"/><text x="85" y="262" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Construct</text><text x="85" y="288" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">in vector</text><text x="245" y="262" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Infect</text><text x="245" y="288" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">explants</text><text x="400" y="262" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Select</text><text x="400" y="288" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">(kanamycin)</text><text x="555" y="262" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Regenerate</text><text x="555" y="288" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">shoots</text><text x="715" y="262" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Confirm</text><text x="715" y="288" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">PCR, RT-PCR</text><text x="400" y="375" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Only transformed cells carry the marker and survive selection</text><text x="400" y="415" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal" font-style="normal">Regeneration uses the auxin : cytokinin rules of tissue culture</text></g></svg>
