<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Salicylic acid and jasmonic acid antagonism</title><desc id="desc">Biotrophic pathogens induce salicylic acid, giving the hypersensitive response, SAR and PR proteins. Necrotrophs and chewing insects induce jasmonic acid with ethylene, giving proteinase inhibitors and phytoalexins. Each pathway suppresses the other.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="36" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Two defence pathways that hold each other back</text><rect x="80" y="60" width="280" height="50" rx="6" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="220" y="94" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Biotrophic pathogens</text><rect x="430" y="60" width="320" height="50" rx="6" fill="#f3e8df" stroke="#b37a22" stroke-width="3"/><text x="590" y="94" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Necrotrophs, chewing insects</text><line x1="220" y1="112" x2="220" y2="140" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 220 140 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(90.0 220 140)"/><line x1="590" y1="112" x2="590" y2="140" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 590 140 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(90.0 590 140)"/><circle cx="220" cy="210" r="68" fill="#eaf3f5" stroke="#267a91" stroke-width="4"/><text x="220" y="222" font-size="38" fill="#267a91" text-anchor="middle" font-weight="bold" font-style="normal">SA</text><circle cx="590" cy="210" r="68" fill="#fbf1df" stroke="#b37a22" stroke-width="4"/><text x="590" y="205" font-size="38" fill="#b37a22" text-anchor="middle" font-weight="bold" font-style="normal">JA</text><text x="590" y="240" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="normal" font-style="normal">+ ethylene</text><line x1="292" y1="185" x2="515" y2="185" stroke="#b64853" stroke-width="4" stroke-dasharray=""/><line x1="515.0" y1="169.0" x2="515.0" y2="201.0" stroke="#b64853" stroke-width="6" stroke-dasharray=""/><line x1="518" y1="238" x2="295" y2="238" stroke="#b64853" stroke-width="4" stroke-dasharray=""/><line x1="295.0" y1="254.0" x2="295.0" y2="222.0" stroke="#b64853" stroke-width="6" stroke-dasharray=""/><text x="405" y="220" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal" font-style="normal">suppress</text><line x1="220" y1="280" x2="220" y2="305" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 220 305 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(90.0 220 305)"/><line x1="590" y1="280" x2="590" y2="305" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 590 305 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(90.0 590 305)"/><text x="220" y="333" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">HR, SAR,</text><text x="220" y="359" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">PR proteins</text><text x="590" y="333" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Proteinase inhibitors,</text><text x="590" y="359" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">phytoalexins</text><text x="400" y="418" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Pseudomonas makes coronatine, a JA mimic, to switch SA off</text></g></svg>
