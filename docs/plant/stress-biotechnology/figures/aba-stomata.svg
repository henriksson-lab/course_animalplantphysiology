<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">ABA closes stomata</title><desc id="desc">A pair of swollen guard cells surrounds an open pore. ABA binds receptors in the guard cells; potassium ions, anions and then water leave, the guard cells lose turgor and the pore closes. The cost is less CO2 uptake and less evaporative cooling.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="36" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">ABA closes stomata by draining guard-cell turgor</text><ellipse cx="130" cy="175" rx="72" ry="100" fill="#e1ebdc" stroke="#397646" stroke-width="3" transform="rotate(0 130 175)"/><ellipse cx="130" cy="175" rx="26" ry="70" fill="white" stroke="#397646" stroke-width="3" transform="rotate(0 130 175)"/><line x1="130" y1="75" x2="130" y2="105" stroke="#397646" stroke-width="3" stroke-dasharray=""/><line x1="130" y1="245" x2="130" y2="275" stroke="#397646" stroke-width="3" stroke-dasharray=""/><circle cx="85" cy="135" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><circle cx="80" cy="185" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><circle cx="88" cy="230" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><circle cx="175" cy="135" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><circle cx="180" cy="185" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><circle cx="172" cy="230" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><ellipse cx="560" cy="175" rx="72" ry="100" fill="#e1ebdc" stroke="#397646" stroke-width="3" transform="rotate(0 560 175)"/><ellipse cx="560" cy="175" rx="3" ry="70" fill="white" stroke="#397646" stroke-width="3" transform="rotate(0 560 175)"/><line x1="560" y1="75" x2="560" y2="105" stroke="#397646" stroke-width="3" stroke-dasharray=""/><line x1="560" y1="245" x2="560" y2="275" stroke="#397646" stroke-width="3" stroke-dasharray=""/><circle cx="515" cy="135" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><circle cx="510" cy="185" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><circle cx="518" cy="230" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><circle cx="605" cy="135" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><circle cx="610" cy="185" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><circle cx="602" cy="230" r="7" fill="#397646" stroke="#397646" stroke-width="1"/><text x="130" y="310" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Open: guard cells</text><text x="130" y="337" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">swollen with water</text><text x="560" y="310" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Closed: turgor lost</text><line x1="225" y1="175" x2="455" y2="175" stroke="#b37a22" stroke-width="4" stroke-dasharray=""/><path d="M 455 175 l -14 -8 l 0 16 Z" fill="#b37a22" transform="rotate(0.0 455 175)"/><rect x="285" y="125" width="110" height="38" rx="6" fill="#fbf1df" stroke="#b37a22" stroke-width="3"/><text x="340" y="152" font-size="25" fill="#b37a22" text-anchor="middle" font-weight="bold" font-style="normal">ABA</text><text x="340" y="212" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">binds guard-cell</text><text x="340" y="238" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">receptors</text><line x1="640" y1="120" x2="690" y2="120" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 690 120 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(0.0 690 120)"/><text x="698" y="128" font-size="23" fill="#267a91" text-anchor="start" font-weight="normal" font-style="normal">K⁺</text><line x1="640" y1="175" x2="690" y2="175" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 690 175 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(0.0 690 175)"/><text x="698" y="183" font-size="23" fill="#267a91" text-anchor="start" font-weight="normal" font-style="normal">anions</text><line x1="640" y1="230" x2="690" y2="230" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 690 230 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(0.0 690 230)"/><text x="698" y="238" font-size="23" fill="#267a91" text-anchor="start" font-weight="normal" font-style="normal">H₂O</text><text x="400" y="378" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal" font-style="normal">Ion channels open → K⁺ and anions leave → water follows</text><text x="400" y="418" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal" font-style="normal">Cost: CO₂ uptake and evaporative cooling fall too</text></g></svg>
