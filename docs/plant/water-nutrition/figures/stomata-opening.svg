<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Guard cells close and open a stoma</title><desc id="desc">A closed stoma has two slack guard cells pressed together. After H+ is pumped out and K+ and Cl- enter, water follows, turgor rises and the swollen guard cells bow apart to open the pore.</desc><g font-family="Arial, sans-serif"><text x="200" y="40" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Closed</text><text x="600" y="40" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Open</text><path d="M 138 200 a 62 120 0 1 0 124 0 a 62 120 0 1 0 -124 0 Z M 196 200 a 4 82 0 1 0 8 0 a 4 82 0 1 0 -8 0 Z" fill="#e2eedf" fill-rule="evenodd" stroke="#397646" stroke-width="4"/><line x1="200" y1="80" x2="200" y2="118" stroke="#397646" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="200" y1="282" x2="200" y2="320" stroke="#397646" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 514 200 a 86 120 0 1 0 172 0 a 86 120 0 1 0 -172 0 Z M 570 200 a 30 84 0 1 0 60 0 a 30 84 0 1 0 -60 0 Z" fill="#cfe5c8" fill-rule="evenodd" stroke="#397646" stroke-width="4"/><line x1="600" y1="80" x2="600" y2="116" stroke="#397646" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><line x1="600" y1="284" x2="600" y2="320" stroke="#397646" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><text x="200" y="355" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">low turgor: pore shut</text><text x="600" y="355" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">high turgor: pore open</text><line x1="690" y1="150" x2="770" y2="130" stroke="#b64853" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 770 130 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(-14.0 770 130)"/><text x="745" y="112" font-size="23" fill="#b64853" text-anchor="middle" font-weight="bold">H⁺</text><line x1="775" y1="215" x2="695" y2="215" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 695 215 l -14 -8 l 0 16 Z" fill="#b37a22" transform="rotate(180.0 695 215)"/><text x="740" y="200" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="bold">K⁺ Cl⁻</text><line x1="775" y1="280" x2="690" y2="270" stroke="#267a91" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 690 270 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(-173.3 690 270)"/><text x="745" y="308" font-size="23" fill="#267a91" text-anchor="middle" font-weight="bold">H₂O</text><line x1="425" y1="200" x2="500" y2="200" stroke="#243645" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 500 200 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(0.0 500 200)"/><text x="462" y="180" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">light</text><line x1="600" y1="250" x2="520" y2="300" stroke="#243645" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/><text x="505" y="315" font-size="22" fill="#243645" text-anchor="end" font-weight="normal">pore</text><text x="400" y="410" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Solutes in → Ψ falls → water in → guard cells bow apart</text></g></svg>
