<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Three routes of water across the root</title><desc id="desc">Water moves from soil through epidermis and cortex to the endodermis by apoplastic, symplastic and transmembrane routes. The Casparian strip in the endodermal walls blocks the apoplast, so all water crosses a membrane before reaching the xylem.</desc><g font-family="Arial, sans-serif"><rect x="20" y="105" width="760" height="250" rx="4" fill="#f3e8df" stroke="#d8c3ae" stroke-width="2"/><rect x="110" y="130" width="115" height="200" rx="8" fill="#e2eedf" stroke="#397646" stroke-width="3"/><rect x="237" y="130" width="115" height="200" rx="8" fill="#e2eedf" stroke="#397646" stroke-width="3"/><rect x="364" y="130" width="115" height="200" rx="8" fill="#e2eedf" stroke="#397646" stroke-width="3"/><rect x="491" y="130" width="105" height="200" rx="8" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="300" y="92" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Cortex</text><text x="167.5" y="92" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Epidermis</text><text x="543.5" y="92" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Endodermis</text><text x="55" y="92" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Soil</text><text x="700" y="92" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Stele</text><path d="M110 262 L40 262 Q28 272 40 282 L110 282" fill="#e2eedf" stroke="#397646" stroke-width="3"/><rect x="108" y="264" width="6" height="16" rx="0" fill="#e2eedf" stroke="#e2eedf" stroke-width="0"/><rect x="491" y="105" width="105" height="25" rx="2" fill="#5a3b1e" stroke="#5a3b1e" stroke-width="1"/><rect x="491" y="330" width="105" height="25" rx="2" fill="#5a3b1e" stroke="#5a3b1e" stroke-width="1"/><line x1="545" y1="357" x2="545" y2="405" stroke="#243645" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/><text x="560" y="428" font-size="22" fill="#5a3b1e" text-anchor="start" font-weight="bold">Casparian strip</text><rect x="640" y="150" width="120" height="160" rx="10" fill="white" stroke="#243645" stroke-width="7"/><text x="700" y="238" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">xylem</text><rect x="225" y="193" width="12" height="14" rx="2" fill="#e2eedf" stroke="#397646" stroke-width="2"/><rect x="352" y="193" width="12" height="14" rx="2" fill="#e2eedf" stroke="#397646" stroke-width="2"/><rect x="479" y="193" width="12" height="14" rx="2" fill="#e2eedf" stroke="#397646" stroke-width="2"/><path d="M 30 117 L 485 117 L 485 165 L 522 165" fill="none" stroke="#267a91" stroke-width="4" stroke-dasharray="10 7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 522 165 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(0.0 522 165)"/><path d="M 70 272 L 150 272 L 150 200 L 560 200 L 632 200" fill="none" stroke="#397646" stroke-width="5" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round"/><path d="M 632 200 l -14 -8 l 0 16 Z" fill="#397646" transform="rotate(0.0 632 200)"/><path d="M 90 305 L 632 305" fill="none" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linejoin="round" stroke-linecap="round"/><path d="M 632 305 l -14 -8 l 0 16 Z" fill="#b37a22" transform="rotate(0.0 632 305)"/><circle cx="110" cy="305" r="6" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><circle cx="225" cy="305" r="6" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><circle cx="237" cy="305" r="6" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><circle cx="352" cy="305" r="6" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><circle cx="364" cy="305" r="6" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><circle cx="479" cy="305" r="6" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><circle cx="491" cy="305" r="6" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><circle cx="596" cy="305" r="6" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><path d="M 530 172 L 632 186" fill="none" stroke="#267a91" stroke-width="4" stroke-dasharray="10 7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 632 186 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(7.8 632 186)"/><text x="20" y="395" font-size="22" fill="#267a91" text-anchor="start" font-weight="normal">- - apoplastic: walls only</text><text x="420" y="395" font-size="22" fill="#397646" text-anchor="start" font-weight="normal">—— symplastic: plasmodesmata</text><text x="20" y="428" font-size="22" fill="#b37a22" text-anchor="start" font-weight="normal">—o— transmembrane: every membrane</text></g></svg>
