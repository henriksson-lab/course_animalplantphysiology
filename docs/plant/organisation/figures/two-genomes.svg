<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Rubisco subunits from two genomes</title><desc id="desc">The small subunit of Rubisco is encoded in the nucleus, made in the cytosol and imported into the chloroplast. The large subunit is encoded by plastid DNA and made inside the chloroplast, where both assemble.</desc><g font-family="Arial, sans-serif"><text x="400" y="34" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Rubisco is built from two genomes</text><circle cx="115" cy="205" r="78" fill="#f4f5f6" stroke="#243645" stroke-width="3"/><text x="115" y="195" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Nucleus</text><text x="115" y="228" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="bold">rbcS gene</text><line x1="185" y1="245" x2="262" y2="262" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 262 262 l -14 -8 l 0 16 Z" fill="#b37a22" transform="rotate(12.4 262 262)"/><text x="270" y="310" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">made in</text><text x="270" y="335" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">cytosol</text><circle cx="285" cy="265" r="18" fill="#fff4df" stroke="#b37a22" stroke-width="3"/><text x="285" y="273" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="bold">S</text><ellipse cx="565" cy="210" rx="215" ry="140" fill="#eef6ea" stroke="#397646" stroke-width="4"/><text x="565" y="330" font-size="23" fill="#397646" text-anchor="middle" font-weight="normal">Chloroplast</text><line x1="305" y1="262" x2="600" y2="228" stroke="#b37a22" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 600 228 l -14 -8 l 0 16 Z" fill="#b37a22" transform="rotate(-6.6 600 228)"/><text x="430" y="285" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="normal">imported</text><circle cx="450" cy="150" r="26" fill="none" stroke="#397646" stroke-width="4"/><text x="450" y="205" font-size="22" fill="#267a91" text-anchor="middle" font-weight="bold">rbcL gene</text><text x="450" y="231" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">(plastid DNA)</text><line x1="478" y1="152" x2="518" y2="157" stroke="#267a91" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 518 157 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(7.1 518 157)"/><circle cx="536" cy="160" r="16" fill="#d8eaf0" stroke="#267a91" stroke-width="3"/><text x="536" y="168" font-size="22" fill="#267a91" text-anchor="middle" font-weight="bold">L</text><line x1="554" y1="167" x2="600" y2="185" stroke="#243645" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 600 185 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(21.4 600 185)"/><circle cx="625" cy="180" r="14" fill="#d8eaf0" stroke="#267a91" stroke-width="2"/><text x="625" y="187" font-size="18" fill="#267a91" text-anchor="middle" font-weight="bold">L</text><circle cx="625" cy="214" r="14" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><text x="625" y="221" font-size="18" fill="#b37a22" text-anchor="middle" font-weight="bold">S</text><circle cx="655" cy="180" r="14" fill="#d8eaf0" stroke="#267a91" stroke-width="2"/><text x="655" y="187" font-size="18" fill="#267a91" text-anchor="middle" font-weight="bold">L</text><circle cx="655" cy="214" r="14" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><text x="655" y="221" font-size="18" fill="#b37a22" text-anchor="middle" font-weight="bold">S</text><circle cx="685" cy="180" r="14" fill="#d8eaf0" stroke="#267a91" stroke-width="2"/><text x="685" y="187" font-size="18" fill="#267a91" text-anchor="middle" font-weight="bold">L</text><circle cx="685" cy="214" r="14" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><text x="685" y="221" font-size="18" fill="#b37a22" text-anchor="middle" font-weight="bold">S</text><circle cx="715" cy="180" r="14" fill="#d8eaf0" stroke="#267a91" stroke-width="2"/><text x="715" y="187" font-size="18" fill="#267a91" text-anchor="middle" font-weight="bold">L</text><circle cx="715" cy="214" r="14" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><text x="715" y="221" font-size="18" fill="#b37a22" text-anchor="middle" font-weight="bold">S</text><text x="670" y="262" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Rubisco</text><text x="670" y="290" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">8 L + 8 S</text><text x="400" y="385" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Large subunit: plastid gene. Small subunit: nuclear gene.</text><text x="400" y="420" font-size="23" fill="#b64853" text-anchor="middle" font-weight="normal">A nuclear mutation can stop photosynthesis.</text></g></svg>
