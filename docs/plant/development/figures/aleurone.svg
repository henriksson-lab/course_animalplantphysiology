<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Gibberellin and the barley aleurone layer</title><desc id="desc">In a barley grain the embryo releases gibberellin. The living aleurone layer around the dead starchy endosperm switches on the alpha-amylase gene and secretes the enzyme into the endosperm, where starch is digested to sugars that the scutellum absorbs for the embryo. ABA blocks the aleurone response.</desc><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal">Gibberellin from the embryo mobilises the endosperm</text><ellipse cx="430" cy="250" rx="335" ry="140" fill="#efe3c8" stroke="#243645" stroke-width="2" transform="rotate(0 430 250)"/><ellipse cx="430" cy="250" rx="322" ry="127" fill="#fff4df" stroke="#b37a22" stroke-width="16" transform="rotate(0 430 250)"/><path d="M 112 195 C 150 170 185 190 190 250 C 185 310 150 330 112 305 C 98 280 98 220 112 195 Z" fill="#e2eedf" stroke="#397646" stroke-width="3" stroke-linejoin="round"/><path d="M 200 180 C 222 220 222 280 200 320" fill="none" stroke="#397646" stroke-width="8" stroke-linejoin="round"/><text x="150" y="160" font-size="22" fill="#397646" text-anchor="end" font-weight="bold">embryo</text><path d="M 175 195 C 210 120 290 120 330 128" fill="none" stroke="#397646" stroke-width="4" stroke-dasharray=""/><path d="M 330 128 l -13 -7 l 0 14 Z" fill="#397646" transform="rotate(11.3 330 128)"/><text x="290" y="180" font-size="24" fill="#397646" text-anchor="middle" font-weight="bold">1 GA</text><line x1="590" y1="126" x2="622" y2="106" stroke="#b37a22" stroke-width="2" stroke-dasharray=""/><text x="790" y="68" font-size="22" fill="#b37a22" text-anchor="end" font-weight="bold">2 aleurone (living):</text><text x="790" y="96" font-size="22" fill="#b37a22" text-anchor="end" font-weight="normal">α-amylase gene on</text><line x1="450" y1="131" x2="450" y2="175" stroke="#b37a22" stroke-width="3" stroke-dasharray=""/><path d="M 450 175 l -13 -7 l 0 14 Z" fill="#b37a22" transform="rotate(90.0 450 175)"/><line x1="560" y1="136" x2="545" y2="178" stroke="#b37a22" stroke-width="3" stroke-dasharray=""/><path d="M 545 178 l -13 -7 l 0 14 Z" fill="#b37a22" transform="rotate(109.7 545 178)"/><line x1="680" y1="165" x2="650" y2="196" stroke="#b37a22" stroke-width="3" stroke-dasharray=""/><path d="M 650 196 l -13 -7 l 0 14 Z" fill="#b37a22" transform="rotate(134.1 650 196)"/><line x1="520" y1="368" x2="520" y2="325" stroke="#b37a22" stroke-width="3" stroke-dasharray=""/><path d="M 520 325 l -13 -7 l 0 14 Z" fill="#b37a22" transform="rotate(-90.0 520 325)"/><line x1="650" y1="345" x2="625" y2="310" stroke="#b37a22" stroke-width="3" stroke-dasharray=""/><path d="M 625 310 l -13 -7 l 0 14 Z" fill="#b37a22" transform="rotate(-125.5 625 310)"/><text x="560" y="225" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">3 α-amylase digests</text><text x="560" y="255" font-size="24" fill="#243645" text-anchor="middle" font-weight="bold">starch → sugars</text><line x1="420" y1="290" x2="228" y2="268" stroke="#267a91" stroke-width="4" stroke-dasharray=""/><path d="M 228 268 l -13 -7 l 0 14 Z" fill="#267a91" transform="rotate(-173.5 228 268)"/><text x="365" y="320" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">4 sugars to the embryo</text><text x="365" y="346" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">via the scutellum</text><text x="430" y="422" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">Endosperm is dead storage tissue. ABA blocks step 2.</text></g></svg>
