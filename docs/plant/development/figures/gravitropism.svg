<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Gravitropism in a root and a shoot laid horizontal</title><desc id="desc">In a horizontal root, amyloplasts in the root cap settle to the lower side and auxin accumulates on the lower side, where it inhibits elongation, so the root bends down. In a horizontal shoot auxin also accumulates on the lower side but promotes elongation, so the shoot bends up.</desc><g font-family="Arial, sans-serif"><text x="200" y="32" font-size="25" fill="#243645" text-anchor="middle" font-weight="bold">Root laid flat</text><text x="600" y="32" font-size="25" fill="#243645" text-anchor="middle" font-weight="bold">Shoot laid flat</text><line x1="400" y1="50" x2="400" y2="420" stroke="#9aa5ad" stroke-width="2" stroke-dasharray="6 6"/><line x1="770" y1="60" x2="770" y2="120" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 770 120 l -13 -7 l 0 14 Z" fill="#243645" transform="rotate(90.0 770 120)"/><text x="760" y="100" font-size="22" fill="#243645" text-anchor="end" font-weight="normal">gravity</text><path d="M 38 140 L 160 140 C 230 140 270 180 285 250" fill="none" stroke="#8a6b4a" stroke-width="58" stroke-linejoin="round" stroke-linecap="round"/><path d="M 38 140 L 160 140 C 230 140 270 180 285 250" fill="none" stroke="#f3e8df" stroke-width="52" stroke-linejoin="round" stroke-linecap="round"/><circle cx="288" cy="258" r="34" fill="#fff4df" stroke="#b37a22" stroke-width="3"/><circle cx="276" cy="276" r="5" fill="#9aa5ad" stroke="#243645" stroke-width="1.5"/><circle cx="288" cy="280" r="5" fill="#9aa5ad" stroke="#243645" stroke-width="1.5"/><circle cx="300" cy="276" r="5" fill="#9aa5ad" stroke="#243645" stroke-width="1.5"/><circle cx="282" cy="268" r="5" fill="#9aa5ad" stroke="#243645" stroke-width="1.5"/><circle cx="295" cy="269" r="5" fill="#9aa5ad" stroke="#243645" stroke-width="1.5"/><text x="190" y="335" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="bold">root cap: amyloplasts</text><text x="190" y="361" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="normal">settle to the lower side</text><circle cx="50" cy="162" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="90" cy="162" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="130" cy="162" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="170" cy="162" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><text x="20" y="210" font-size="22" fill="#b64853" text-anchor="start" font-weight="bold">auxin to lower side:</text><text x="20" y="236" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">inhibits elongation</text><text x="20" y="100" font-size="22" fill="#397646" text-anchor="start" font-weight="normal">upper side grows faster</text><text x="20" y="285" font-size="24" fill="#397646" text-anchor="start" font-weight="bold">root bends down</text><path d="M 440 330 L 600 330 C 680 330 720 290 735 200" fill="none" stroke="#397646" stroke-width="46" stroke-linejoin="round" stroke-linecap="round"/><path d="M 440 330 L 600 330 C 680 330 720 290 735 200" fill="none" stroke="#e2eedf" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><circle cx="480" cy="347" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="520" cy="347" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="560" cy="347" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="600" cy="347" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><text x="450" y="395" font-size="22" fill="#b64853" text-anchor="start" font-weight="bold">auxin to the lower side:</text><text x="450" y="421" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">promotes elongation there</text><text x="560" y="230" font-size="24" fill="#397646" text-anchor="end" font-weight="bold">shoot bends</text><text x="560" y="258" font-size="24" fill="#397646" text-anchor="end" font-weight="bold">up</text></g></svg>
