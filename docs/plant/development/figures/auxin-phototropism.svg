<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Cholodny-Went model of phototropism</title><desc id="desc">Blue light from one side is sensed by phototropin at the coleoptile tip. Auxin is moved to the shaded side and transported down, so cells on the shaded side elongate faster and the shoot bends towards the light.</desc><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal">Auxin moves to the shaded side, so the shoot bends</text><line x1="40" y1="130" x2="150" y2="130" stroke="#b37a22" stroke-width="5" stroke-dasharray=""/><path d="M 150 130 l -13 -7 l 0 14 Z" fill="#b37a22" transform="rotate(0.0 150 130)"/><line x1="40" y1="175" x2="150" y2="175" stroke="#b37a22" stroke-width="5" stroke-dasharray=""/><path d="M 150 175 l -13 -7 l 0 14 Z" fill="#b37a22" transform="rotate(0.0 150 175)"/><line x1="40" y1="220" x2="150" y2="220" stroke="#b37a22" stroke-width="5" stroke-dasharray=""/><path d="M 150 220 l -13 -7 l 0 14 Z" fill="#b37a22" transform="rotate(0.0 150 220)"/><text x="95" y="105" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="normal">blue light</text><path d="M 210 405 L 210 150" fill="none" stroke="#397646" stroke-width="62" stroke-linejoin="round" stroke-linecap="round"/><path d="M 210 405 L 210 150" fill="none" stroke="#e2eedf" stroke-width="56" stroke-linejoin="round" stroke-linecap="round"/><circle cx="210" cy="140" r="30" fill="none" stroke="#267a91" stroke-width="3"/><text x="255" y="105" font-size="22" fill="#267a91" text-anchor="start" font-weight="normal">tip senses light</text><text x="255" y="131" font-size="22" fill="#267a91" text-anchor="start" font-weight="normal">(phototropin)</text><circle cx="222" cy="150" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="228" cy="175" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="226" cy="205" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="227" cy="240" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="226" cy="275" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="227" cy="310" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="226" cy="345" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="197" cy="300" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><line x1="198" y1="160" x2="222" y2="168" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 222 168 l -13 -7 l 0 14 Z" fill="#b64853" transform="rotate(18.4 222 168)"/><line x1="248" y1="200" x2="248" y2="360" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 248 360 l -13 -7 l 0 14 Z" fill="#b64853" transform="rotate(90.0 248 360)"/><text x="262" y="260" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">auxin moves to</text><text x="262" y="286" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">the shaded side</text><text x="262" y="312" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">and down</text><text x="170" y="380" font-size="22" fill="#243645" text-anchor="end" font-weight="normal">lit side</text><line x1="470" y1="60" x2="470" y2="420" stroke="#9aa5ad" stroke-width="2" stroke-dasharray="6 6"/><line x1="480" y1="215" x2="540" y2="215" stroke="#b37a22" stroke-width="5" stroke-dasharray=""/><path d="M 540 215 l -13 -7 l 0 14 Z" fill="#b37a22" transform="rotate(0.0 540 215)"/><line x1="480" y1="255" x2="540" y2="255" stroke="#b37a22" stroke-width="5" stroke-dasharray=""/><path d="M 540 255 l -13 -7 l 0 14 Z" fill="#b37a22" transform="rotate(0.0 540 255)"/><path d="M 600 405 L 600 290 C 600 210 560 160 515 140" fill="none" stroke="#397646" stroke-width="62" stroke-linejoin="round" stroke-linecap="round"/><path d="M 600 405 L 600 290 C 600 210 560 160 515 140" fill="none" stroke="#e2eedf" stroke-width="56" stroke-linejoin="round" stroke-linecap="round"/><circle cx="620" cy="360" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="622" cy="320" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="623" cy="280" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><circle cx="618" cy="240" r="6" fill="#b64853" stroke="#b64853" stroke-width="0"/><text x="648" y="266" font-size="22" fill="#b64853" text-anchor="start" font-weight="bold">shaded side:</text><text x="648" y="292" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">more auxin,</text><text x="648" y="318" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">grows faster</text><text x="648" y="380" font-size="22" fill="#397646" text-anchor="start" font-weight="bold">bends towards</text><text x="648" y="406" font-size="22" fill="#397646" text-anchor="start" font-weight="bold">the light</text></g></svg>
