<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Florigen: FT protein travels from leaf to shoot apex</title><desc id="desc">In a leaf under long days CONSTANS switches on the FT gene. FT protein moves in the phloem up the stem to the shoot apex, where FT and FD switch on floral identity genes and flowers form.</desc><g font-family="Arial, sans-serif"><line x1="120" y1="420" x2="780" y2="420" stroke="#8a6b4a" stroke-width="4" stroke-dasharray=""/><path d="M 450 420 L 450 115" fill="none" stroke="#397646" stroke-width="10" stroke-linejoin="round"/><path d="M 450 330 C 520 300 640 290 720 250 C 640 330 520 350 450 330 Z" fill="#e2eedf" stroke="#397646" stroke-width="3" stroke-linejoin="round"/><path d="M 450 380 C 400 360 330 350 290 330 C 340 395 410 395 450 380 Z" fill="#e2eedf" stroke="#397646" stroke-width="3" stroke-linejoin="round"/><path d="M 450 230 C 410 205 370 200 345 185 C 375 240 420 245 450 230 Z" fill="#e2eedf" stroke="#397646" stroke-width="3" stroke-linejoin="round"/><path d="M 690 262 C 600 300 520 320 457 322 L 457 125" fill="none" stroke="#b37a22" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 6"/><circle cx="640" cy="286" r="8" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="560" cy="310" r="8" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="457" cy="290" r="8" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="457" cy="240" r="8" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="457" cy="190" r="8" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="457" cy="150" r="8" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><path d="M 425 115 C 425 70 475 70 475 115 Z" fill="#f5dadd" stroke="#b64853" stroke-width="3" stroke-linejoin="round"/><circle cx="437" cy="70" r="13" fill="#f5dadd" stroke="#b64853" stroke-width="2"/><circle cx="463" cy="70" r="13" fill="#f5dadd" stroke="#b64853" stroke-width="2"/><circle cx="450" cy="55" r="13" fill="#f5dadd" stroke="#b64853" stroke-width="2"/><text x="500" y="60" font-size="22" fill="#b64853" text-anchor="start" font-weight="bold">3 apex: FT + FD</text><text x="500" y="88" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">→ flower genes on</text><text x="505" y="200" font-size="22" fill="#b37a22" text-anchor="start" font-weight="bold">2 FT protein moves</text><text x="505" y="226" font-size="22" fill="#b37a22" text-anchor="start" font-weight="normal">in the phloem</text><text x="560" y="360" font-size="22" fill="#397646" text-anchor="start" font-weight="bold">1 leaf: long days</text><text x="560" y="386" font-size="22" fill="#397646" text-anchor="start" font-weight="normal">CONSTANS → FT on</text><text x="20" y="40" font-size="25" fill="#243645" text-anchor="start" font-weight="bold">Florigen:</text><text x="20" y="70" font-size="23" fill="#243645" text-anchor="start" font-weight="normal">a protein from leaf to apex</text></g></svg>
