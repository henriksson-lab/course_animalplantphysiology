<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The three phases of the Calvin-Benson cycle</title><desc id="desc">Rubisco carboxylates 3 RuBP with 3 CO2, giving 6 3-PGA. Reduction with 6 ATP and 6 NADPH gives 6 triose phosphates. Five of them regenerate 3 RuBP using 3 more ATP; one is exported for sucrose and starch.</desc><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal">3 CO₂ in, 1 triose phosphate out</text><rect x="70" y="85" width="230" height="70" rx="6" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="185" y="129" font-size="25" fill="#243645" text-anchor="middle" font-weight="bold">3 RuBP (5C)</text><rect x="500" y="85" width="230" height="70" rx="6" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="615" y="129" font-size="25" fill="#243645" text-anchor="middle" font-weight="bold">6 3-PGA (3C)</text><rect x="285" y="300" width="230" height="70" rx="6" fill="#fff4df" stroke="#b37a22" stroke-width="3"/><text x="400" y="344" font-size="25" fill="#243645" text-anchor="middle" font-weight="bold">6 triose-P (3C)</text><line x1="305" y1="120" x2="494" y2="120" stroke="#397646" stroke-width="4" stroke-dasharray=""/><path d="M 494 120 l -13.0 -7.0 l 0 14.0 Z" fill="#397646" transform="rotate(0.0 494 120)"/><text x="400" y="98" font-size="23" fill="#397646" text-anchor="middle" font-weight="bold">1 Carboxylation</text><text x="400" y="150" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">+ 3 CO₂ (Rubisco)</text><line x1="612" y1="162" x2="480" y2="294" stroke="#267a91" stroke-width="4" stroke-dasharray=""/><path d="M 480 294 l -13.0 -7.0 l 0 14.0 Z" fill="#267a91" transform="rotate(135.0 480 294)"/><text x="600" y="222" font-size="23" fill="#267a91" text-anchor="start" font-weight="bold">2 Reduction</text><text x="600" y="250" font-size="22" fill="#267a91" text-anchor="start" font-weight="normal">6 ATP, 6 NADPH</text><line x1="318" y1="294" x2="188" y2="162" stroke="#b37a22" stroke-width="4" stroke-dasharray=""/><path d="M 188 162 l -13.0 -7.0 l 0 14.0 Z" fill="#b37a22" transform="rotate(-134.6 188 162)"/><text x="205" y="222" font-size="23" fill="#b37a22" text-anchor="end" font-weight="bold">3 Regeneration</text><text x="225" y="250" font-size="22" fill="#b37a22" text-anchor="end" font-weight="normal">5 triose-P, 3 ATP</text><line x1="518" y1="335" x2="585" y2="335" stroke="#b64853" stroke-width="4" stroke-dasharray=""/><path d="M 585 335 l -13.0 -7.0 l 0 14.0 Z" fill="#b64853" transform="rotate(0.0 585 335)"/><text x="595" y="328" font-size="22" fill="#b64853" text-anchor="start" font-weight="bold">export 1:</text><text x="595" y="356" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">sucrose, starch</text><text x="400" y="420" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Carbon: 3 × 5C + 3 CO₂ = 18 C = 6 × 3C</text></g></svg>
