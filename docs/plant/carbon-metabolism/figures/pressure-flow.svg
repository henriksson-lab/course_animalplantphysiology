<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The pressure-flow (Muench) model of phloem transport</title><desc id="desc">At the source, sucrose is loaded into the sieve tube, water follows from the xylem by osmosis and pressure rises. Sap moves by bulk flow to the sink, where sucrose is unloaded and water leaves, keeping the pressure low. Water returns in the xylem.</desc><defs><linearGradient id="press" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7fb08a"/><stop offset="1" stop-color="#eef6ec"/></linearGradient></defs><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="25" fill="#243645" text-anchor="middle" font-weight="normal">Osmosis at the source drives bulk flow to the sink</text><rect x="15" y="60" width="165" height="330" rx="18" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="97" y="100" font-size="24" fill="#397646" text-anchor="middle" font-weight="bold">SOURCE</text><text x="97" y="128" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">(leaf)</text><rect x="620" y="60" width="165" height="330" rx="18" fill="#f3e8df" stroke="#b37a22" stroke-width="3"/><text x="702" y="100" font-size="24" fill="#b37a22" text-anchor="middle" font-weight="bold">SINK</text><text x="702" y="128" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="normal">(root, fruit)</text><rect x="120" y="150" width="560" height="80" rx="8" fill="url(#press)" stroke="#397646" stroke-width="3"/><text x="400" y="142" font-size="22" fill="#397646" text-anchor="middle" font-weight="bold">phloem sieve tube</text><rect x="120" y="320" width="560" height="44" rx="8" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><text x="400" y="395" font-size="22" fill="#267a91" text-anchor="middle" font-weight="bold">xylem</text><line x1="560" y1="342" x2="240" y2="342" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 240 342 l -13.0 -7.0 l 0 14.0 Z" fill="#267a91" transform="rotate(180.0 240 342)"/><circle cx="140" cy="215" r="6" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="165" cy="168" r="6" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="190" cy="212" r="6" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="215" cy="165" r="6" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="245" cy="214" r="6" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="280" cy="168" r="6" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="310" cy="214" r="6" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="350" cy="170" r="6" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="470" cy="168" r="6" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="430" cy="216" r="6" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><circle cx="560" cy="216" r="6" fill="#f2c45a" stroke="#b37a22" stroke-width="2"/><line x1="55" y1="190" x2="125" y2="190" stroke="#b37a22" stroke-width="4" stroke-dasharray=""/><path d="M 125 190 l -13.0 -7.0 l 0 14.0 Z" fill="#b37a22" transform="rotate(0.0 125 190)"/><text x="97" y="250" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">1 sucrose</text><text x="97" y="276" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">loaded</text><line x1="220" y1="318" x2="220" y2="226" stroke="#267a91" stroke-width="4" stroke-dasharray=""/><path d="M 220 226 l -13.0 -7.0 l 0 14.0 Z" fill="#267a91" transform="rotate(-90.0 220 226)"/><text x="232" y="285" font-size="22" fill="#267a91" text-anchor="start" font-weight="normal">2 water in (osmosis)</text><text x="135" y="197" font-size="22" fill="#b64853" text-anchor="start" font-weight="bold">3 high pressure</text><line x1="355" y1="190" x2="540" y2="190" stroke="#243645" stroke-width="5" stroke-dasharray=""/><path d="M 540 190 l -13.0 -7.0 l 0 14.0 Z" fill="#243645" transform="rotate(0.0 540 190)"/><text x="425" y="258" font-size="22" fill="#243645" text-anchor="middle" font-weight="bold">4 bulk flow</text><line x1="675" y1="190" x2="750" y2="190" stroke="#b37a22" stroke-width="4" stroke-dasharray=""/><path d="M 750 190 l -13.0 -7.0 l 0 14.0 Z" fill="#b37a22" transform="rotate(0.0 750 190)"/><text x="702" y="250" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">5 sucrose</text><text x="702" y="276" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">unloaded</text><line x1="600" y1="226" x2="600" y2="316" stroke="#267a91" stroke-width="4" stroke-dasharray=""/><path d="M 600 316 l -13.0 -7.0 l 0 14.0 Z" fill="#267a91" transform="rotate(90.0 600 316)"/><text x="590" y="280" font-size="22" fill="#267a91" text-anchor="end" font-weight="normal">water out</text><text x="665" y="197" font-size="22" fill="#b64853" text-anchor="end" font-weight="bold">low</text><text x="400" y="432" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Flow goes from high to low pressure, up or down the plant.</text></g></svg>
