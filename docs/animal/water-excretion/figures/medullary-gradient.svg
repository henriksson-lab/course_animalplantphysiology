<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The loop of Henle builds the medullary gradient</title><desc id="desc">Interstitial osmolarity rises from 300 mOsm per litre in the cortex to 1200 in the inner medulla. Water leaves the descending limb; the thick ascending limb pumps NaCl out without water. With ADH, water leaves the collecting duct into the concentrated medulla.</desc><defs><linearGradient id="med" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6ea"/><stop offset="1" stop-color="#d9a35f"/></linearGradient></defs><g font-family="Arial, sans-serif"><rect x="0" y="80" width="800" height="360" rx="0" fill="url(#med)" stroke="none" stroke-width="0"/><text x="400" y="38" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Interstitial osmolarity rises from cortex to inner medulla</text><line x1="0" y1="110" x2="60" y2="110" stroke="#b37a22" stroke-width="2" stroke-dasharray=""/><text x="70" y="118" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">300</text><line x1="0" y1="210" x2="60" y2="210" stroke="#b37a22" stroke-width="2" stroke-dasharray=""/><text x="70" y="218" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">600</text><line x1="0" y1="310" x2="60" y2="310" stroke="#b37a22" stroke-width="2" stroke-dasharray=""/><text x="70" y="318" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">900</text><line x1="0" y1="410" x2="60" y2="410" stroke="#b37a22" stroke-width="2" stroke-dasharray=""/><text x="70" y="418" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">1,200</text><text x="70" y="75" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">mOsm L⁻¹</text><path d="M300 80 L 300 380 C 300 425, 380 425, 380 380 L 380 80" fill="none" stroke="#267a91" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><line x1="300" y1="92" x2="300" y2="138" stroke="white" stroke-width="3" stroke-dasharray=""/><path d="M 300 138 l -14 -8 l 0 16 Z" fill="white" transform="rotate(90.0 300 138)"/><line x1="380" y1="138" x2="380" y2="92" stroke="white" stroke-width="3" stroke-dasharray=""/><path d="M 380 92 l -14 -8 l 0 16 Z" fill="white" transform="rotate(-90.0 380 92)"/><line x1="290" y1="180" x2="238" y2="180" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 238 180 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(180.0 238 180)"/><text x="228" y="188" font-size="22" fill="#267a91" text-anchor="end" font-weight="normal">H₂O</text><line x1="392" y1="180" x2="446" y2="180" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 446 180 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(0.0 446 180)"/><text x="456" y="188" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">NaCl</text><line x1="290" y1="270" x2="238" y2="270" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 238 270 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(180.0 238 270)"/><text x="228" y="278" font-size="22" fill="#267a91" text-anchor="end" font-weight="normal">H₂O</text><line x1="392" y1="270" x2="446" y2="270" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 446 270 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(0.0 446 270)"/><text x="456" y="278" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">NaCl</text><line x1="290" y1="360" x2="238" y2="360" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 238 360 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(180.0 238 360)"/><text x="228" y="368" font-size="22" fill="#267a91" text-anchor="end" font-weight="normal">H₂O</text><line x1="392" y1="360" x2="446" y2="360" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 446 360 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(0.0 446 360)"/><text x="456" y="368" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">NaCl</text><text x="340" y="435" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">loop of Henle</text><text x="205" y="105" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">descending:</text><text x="205" y="131" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">water leaves</text><text x="470" y="105" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">thick ascending:</text><text x="470" y="131" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">NaCl out, no water</text><path d="M730 80 L 730 430" fill="none" stroke="#243645" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><line x1="730" y1="92" x2="730" y2="140" stroke="white" stroke-width="3" stroke-dasharray=""/><path d="M 730 140 l -14 -8 l 0 16 Z" fill="white" transform="rotate(90.0 730 140)"/><line x1="718" y1="270" x2="668" y2="270" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 668 270 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(180.0 668 270)"/><line x1="718" y1="360" x2="668" y2="360" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 668 360 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(180.0 668 360)"/><text x="625" y="215" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">with ADH:</text><text x="625" y="241" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">water leaves</text></g></svg>
