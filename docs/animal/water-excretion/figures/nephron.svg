<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The nephron and its four processes</title><desc id="desc">Plasma is filtered from the glomerulus into Bowman&#x27;s capsule. The fluid passes the proximal tubule, the loop of Henle dipping into the medulla, the distal tubule and the collecting duct. Reabsorption returns substances to the blood, secretion adds them to the tubule, and what remains is excreted.</desc><g font-family="Arial, sans-serif"><rect x="0" y="60" width="800" height="150" rx="0" fill="#fff4df" stroke="none" stroke-width="0"/><rect x="0" y="210" width="800" height="230" rx="0" fill="#f6e6d4" stroke="none" stroke-width="0"/><text x="790" y="95" font-size="24" fill="#b37a22" text-anchor="end" font-weight="normal">cortex</text><text x="10" y="430" font-size="24" fill="#b37a22" text-anchor="start" font-weight="normal">medulla</text><line x1="0" y1="210" x2="800" y2="210" stroke="#b37a22" stroke-width="2" stroke-dasharray="8 6"/><path d="M140 105 A 48 48 0 1 0 140 175" fill="none" stroke="#267a91" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><circle cx="118" cy="140" r="28" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="118" y="40" font-size="23" fill="#b64853" text-anchor="middle" font-weight="normal">glomerulus</text><line x1="60" y1="140" x2="88" y2="140" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 88 140 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(0.0 88 140)"/><path d="M140 105 C 180 80, 220 130, 250 100 C 280 70, 310 140, 330 120" fill="none" stroke="#267a91" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><path d="M330 120 L 340 380 C 345 420, 395 420, 400 380 L 410 160" fill="none" stroke="#267a91" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><path d="M410 160 C 430 100, 470 140, 500 100 C 530 70, 560 130, 590 110" fill="none" stroke="#397646" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><path d="M590 110 L 640 90 L 640 420" fill="none" stroke="#243645" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><text x="240" y="165" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">proximal</text><text x="240" y="191" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">tubule</text><text x="250" y="300" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">loop of</text><text x="250" y="326" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">Henle</text><text x="520" y="160" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">distal</text><text x="520" y="186" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">tubule</text><text x="670" y="300" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">collecting</text><text x="670" y="326" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">duct</text><line x1="640" y1="395" x2="640" y2="432" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 640 432 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(90.0 640 432)"/><text x="25" y="232" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">1 filtration</text><line x1="260" y1="105" x2="260" y2="50" stroke="#397646" stroke-width="3" stroke-dasharray=""/><path d="M 260 50 l -14 -8 l 0 16 Z" fill="#397646" transform="rotate(-90.0 260 50)"/><text x="275" y="45" font-size="22" fill="#397646" text-anchor="start" font-weight="normal">2 reabsorption</text><line x1="470" y1="40" x2="470" y2="105" stroke="#b37a22" stroke-width="3" stroke-dasharray=""/><path d="M 470 105 l -14 -8 l 0 16 Z" fill="#b37a22" transform="rotate(90.0 470 105)"/><text x="485" y="45" font-size="22" fill="#b37a22" text-anchor="start" font-weight="normal">3 secretion</text><text x="622" y="425" font-size="22" fill="#243645" text-anchor="end" font-weight="normal">4 excretion: urine</text></g></svg>
