<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Negative feedback in temperature regulation</title><desc id="desc">A rise in body temperature activates sensing and control, changing heat loss and production. The resulting temperature change opposes the disturbance.</desc><g font-family="Arial, sans-serif"><text x="400" y="35" font-size="25" fill="#243645" text-anchor="middle">Response opposes the temperature disturbance</text><rect x="40" y="75" width="250" height="75" rx="6" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="165" y="107" font-size="25" fill="#243645" text-anchor="middle">Body temperature</text><text x="165" y="137" font-size="25" fill="#243645" text-anchor="middle">rises</text><line x1="295" y1="112" x2="430" y2="112" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 430 112 l -12 -7 l 0 14 Z" fill="#267a91" transform="rotate(0.0 430 112)"/><rect x="440" y="75" width="300" height="75" rx="6" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="590" y="107" font-size="25" fill="#243645" text-anchor="middle">Sensing and</text><text x="590" y="137" font-size="25" fill="#243645" text-anchor="middle">neural control</text><line x1="590" y1="155" x2="590" y2="240" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 590 240 l -12 -7 l 0 14 Z" fill="#267a91" transform="rotate(90.0 590 240)"/><rect x="440" y="250" width="300" height="85" rx="6" fill="#e4efdf" stroke="#397646" stroke-width="3"/><text x="590" y="285" font-size="23" fill="#243645" text-anchor="middle">Heat loss increases;</text><text x="590" y="315" font-size="23" fill="#243645" text-anchor="middle">heat production may fall</text><line x1="430" y1="292" x2="300" y2="292" stroke="#397646" stroke-width="3" stroke-dasharray=""/><path d="M 300 292 l -12 -7 l 0 14 Z" fill="#397646" transform="rotate(180.0 300 292)"/><rect x="40" y="250" width="250" height="85" rx="6" fill="#edf5f7" stroke="#267a91" stroke-width="3"/><text x="165" y="285" font-size="23" fill="#243645" text-anchor="middle">Temperature moves</text><text x="165" y="315" font-size="23" fill="#243645" text-anchor="middle">towards its range</text><line x1="165" y1="245" x2="165" y2="155" stroke="#397646" stroke-width="3" stroke-dasharray=""/><path d="M 165 155 l -12 -7 l 0 14 Z" fill="#397646" transform="rotate(-90.0 165 155)"/><text x="195" y="205" font-size="38" fill="#397646" text-anchor="middle">−</text><text x="400" y="392" font-size="24" fill="#243645" text-anchor="middle">As the deviation falls, the response is reduced.</text><text x="400" y="430" font-size="23" fill="#243645" text-anchor="middle">Negative feedback describes direction, not harm.</text></g></svg>
