<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Long diffusion distances are slow</title><desc id="desc">For unchanged diffusion properties, a tenfold distance has an approximately hundredfold characteristic time. The time bars represent that ratio.</desc><g font-family="Arial, sans-serif"><text x="400" y="38" font-size="25" fill="#243645" text-anchor="middle">Same diffusion coefficient: time scale ∝ distance²</text><rect x="60" y="95" width="95" height="95" rx="6" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="105" cy="140" r="14" fill="#267a91" stroke="#267a91" stroke-width="3"/><line x1="165" y1="142" x2="225" y2="142" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 225 142 l -12 -7 l 0 14 Z" fill="#267a91" transform="rotate(0.0 225 142)"/><circle cx="250" cy="142" r="17" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="160" y="225" font-size="24" fill="#243645" text-anchor="middle">Distance L</text><rect x="60" y="260" width="6" height="35" rx="6" fill="#267a91" stroke="#267a91" stroke-width="3"/><text x="60" y="335" font-size="24" fill="#243645" text-anchor="start">Time scale 1</text><rect x="420" y="95" width="95" height="95" rx="6" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="465" cy="140" r="14" fill="#267a91" stroke="#267a91" stroke-width="3"/><line x1="525" y1="142" x2="735" y2="142" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 735 142 l -12 -7 l 0 14 Z" fill="#267a91" transform="rotate(0.0 735 142)"/><circle cx="760" cy="142" r="17" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="600" y="225" font-size="24" fill="#243645" text-anchor="middle">Distance 10L</text><rect x="180" y="260" width="600" height="35" rx="6" fill="#267a91" stroke="#267a91" stroke-width="3"/><text x="480" y="335" font-size="24" fill="#243645" text-anchor="middle">Time scale 100</text><text x="400" y="395" font-size="23" fill="#243645" text-anchor="middle">Bulk flow bridges long distances; diffusion handles short final steps.</text><text x="400" y="430" font-size="22" fill="#243645" text-anchor="middle">Distance arrows are schematic; time bars show the 1:100 ratio.</text></g></svg>
