<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">An energy budget with proportional flow bands</title><desc id="desc">In this example day, 150 kilojoules of intake is partitioned into 40 in faeces, 10 excreted, 85 metabolic expenditure and 15 retained. Band widths are proportional to the values.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker></defs><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="30" font-size="26" fill="#26343c" text-anchor="middle" font-weight="bold">One interval; one accounting convention</text><path d="M70,210 H290" fill="none" stroke="#246b83" stroke-width="75"/><text x="165" y="110" font-size="26" fill="#246b83" text-anchor="middle" font-weight="normal">Intake</text><text x="165" y="145" font-size="25" fill="#246b83" text-anchor="middle" font-weight="normal">150 kJ</text><path d="M290,210 C385,210 400,92 480,92 H570" fill="none" stroke="#b57c22" stroke-width="20.0"/><text x="590" y="86" font-size="24" fill="#b57c22" text-anchor="start" font-weight="normal">Faeces</text><text x="590" y="115" font-size="23" fill="#b57c22" text-anchor="start" font-weight="normal">40 kJ</text><path d="M290,210 C385,210 400,182 480,182 H570" fill="none" stroke="#a64836" stroke-width="5.0"/><text x="590" y="176" font-size="24" fill="#a64836" text-anchor="start" font-weight="normal">Excreted</text><text x="590" y="205" font-size="23" fill="#a64836" text-anchor="start" font-weight="normal">10 kJ</text><path d="M290,210 C385,210 400,272 480,272 H570" fill="none" stroke="#246b83" stroke-width="42.5"/><text x="590" y="266" font-size="24" fill="#246b83" text-anchor="start" font-weight="normal">Metabolic</text><text x="590" y="295" font-size="23" fill="#246b83" text-anchor="start" font-weight="normal">85 kJ</text><path d="M290,210 C385,210 400,362 480,362 H570" fill="none" stroke="#38794c" stroke-width="7.5"/><text x="590" y="356" font-size="24" fill="#38794c" text-anchor="start" font-weight="normal">Retained</text><text x="590" y="385" font-size="23" fill="#38794c" text-anchor="start" font-weight="normal">15 kJ</text><text x="400" y="424" font-size="25" fill="#26343c" text-anchor="middle" font-weight="bold">150 = 40 + 10 + 85 + 15 kJ</text></g></svg>