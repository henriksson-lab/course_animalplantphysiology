<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Cytosolic and mitochondrial contributions to ATP supply</title><desc id="desc">Cytosolic glycolysis can supply ATP without directly consuming oxygen and supplies carbon to mitochondrial processes. Aerobic mitochondrial metabolism requires oxygen. A bout of activity may use both.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker></defs><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="26" fill="#26343c" text-anchor="middle" font-weight="bold">ATP supply can combine pathways</text><rect x="55" y="75" width="690" height="300" rx="25" fill="#fafbfd" stroke="#c4cdd1" stroke-width="3"/><text x="90" y="113" font-size="24" fill="#26343c" text-anchor="start" font-weight="normal">Cell</text><text x="180" y="160" font-size="27" fill="#246b83" text-anchor="middle" font-weight="normal">Fuel</text><path d="M180,175 L180.0,208.0" fill="none" stroke="#246b83" stroke-width="4"/><path d="M 180 220 l -16 -9 l 0 18 Z" fill="#246b83" transform="rotate(90.0 180 220)"/><text x="180" y="253" font-size="25" fill="#246b83" text-anchor="middle" font-weight="normal">Glycolysis</text><text x="175" y="291" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Cytosol</text><path d="M270,245 L373.0,245.0" fill="none" stroke="#246b83" stroke-width="4"/><path d="M 385 245 l -16 -9 l 0 18 Z" fill="#246b83" transform="rotate(0.0 385 245)"/><text x="325" y="222" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Carbon</text><ellipse cx="535" cy="245" rx="137" ry="85" fill="#e2edf4" stroke="#246b83" stroke-width="3"/><path d="M450,250 Q475,200 495,250 T540,250 T585,250 T630,250" fill="none" stroke="#246b83" stroke-width="3"/><text x="535" y="217" font-size="24" fill="#26343c" text-anchor="middle" font-weight="normal">Mitochondrion</text><text x="535" y="302" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Aerobic processes</text><text x="685" y="150" font-size="28" fill="#a64836" text-anchor="middle" font-weight="normal">O₂</text><path d="M665,163 L637.9,194.0" fill="none" stroke="#a64836" stroke-width="4"/><path d="M 630 203 l -16 -9 l 0 18 Z" fill="#a64836" transform="rotate(131.2 630 203)"/><path d="M185,310 L185.0,333.0" fill="none" stroke="#38794c" stroke-width="4"/><path d="M 185 345 l -16 -9 l 0 18 Z" fill="#38794c" transform="rotate(90.0 185 345)"/><text x="185" y="370" font-size="24" fill="#38794c" text-anchor="middle" font-weight="normal">ATP</text><path d="M540,330 L540.0,333.0" fill="none" stroke="#38794c" stroke-width="4"/><path d="M 540 345 l -16 -9 l 0 18 Z" fill="#38794c" transform="rotate(90.0 540 345)"/><text x="540" y="370" font-size="24" fill="#38794c" text-anchor="middle" font-weight="normal">ATP</text><text x="400" y="420" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Oxygen uptake does not capture every ATP-producing step.</text></g></svg>