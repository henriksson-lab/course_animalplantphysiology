<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Villus epithelial barrier and removal pathways</title><desc id="desc">A finger-like villus is lined by an epithelial barrier and surface projections. Internal capillaries and a lymphatic route remove absorbed materials.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker></defs><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="30" font-size="26" fill="#26343c" text-anchor="middle" font-weight="bold">Villus: more interface, selective entry</text><path d="M140,350 L140,230 C140,165 215,165 215,105 C215,55 300,55 300,105 C300,165 375,165 375,230 L375,350" fill="none" stroke="#246b83" stroke-width="12"/><path d="M195,350 L195,240 C195,205 250,180 250,120 C250,90 270,90 270,120 C270,180 325,205 325,240 L325,350" fill="none" stroke="#a64836" stroke-width="7"/><path d="M260,350 L260,220" fill="none" stroke="#38794c" stroke-width="14"/><circle cx="260" cy="220" r="14" fill="#dcebdc" stroke="#38794c" stroke-width="2"/><path d="M141,225 l-15,-10 M149,221 l-9,-17 M157,225 l-2,-20" fill="none" stroke="#246b83" stroke-width="2"/><path d="M155,192 l-15,-10 M163,188 l-9,-17 M171,192 l-2,-20" fill="none" stroke="#246b83" stroke-width="2"/><path d="M180,167 l-15,-10 M188,163 l-9,-17 M196,167 l-2,-20" fill="none" stroke="#246b83" stroke-width="2"/><path d="M202,135 l-15,-10 M210,131 l-9,-17 M218,135 l-2,-20" fill="none" stroke="#246b83" stroke-width="2"/><path d="M292,136 l-15,-10 M300,132 l-9,-17 M308,136 l-2,-20" fill="none" stroke="#246b83" stroke-width="2"/><path d="M321,167 l-15,-10 M329,163 l-9,-17 M337,167 l-2,-20" fill="none" stroke="#246b83" stroke-width="2"/><path d="M346,195 l-15,-10 M354,191 l-9,-17 M362,195 l-2,-20" fill="none" stroke="#246b83" stroke-width="2"/><path d="M361,228 l-15,-10 M369,224 l-9,-17 M377,228 l-2,-20" fill="none" stroke="#246b83" stroke-width="2"/><text x="505" y="110" font-size="24" fill="#26343c" text-anchor="middle" font-weight="normal">Lumen</text><path d="M455,125 L337.0,125.0" fill="none" stroke="#246b83" stroke-width="4"/><path d="M 325 125 l -16 -9 l 0 18 Z" fill="#246b83" transform="rotate(180.0 325 125)"/><text x="570" y="195" font-size="24" fill="#26343c" text-anchor="middle" font-weight="normal">Epithelial barrier</text><path d="M470,202 L381.9,213.5" fill="none" stroke="#246b83" stroke-width="4"/><path d="M 370 215 l -16 -9 l 0 18 Z" fill="#246b83" transform="rotate(172.6 370 215)"/><text x="570" y="270" font-size="24" fill="#a64836" text-anchor="middle" font-weight="normal">Blood capillaries</text><path d="M465,275 L337.0,275.0" fill="none" stroke="#a64836" stroke-width="4"/><path d="M 325 275 l -16 -9 l 0 18 Z" fill="#a64836" transform="rotate(180.0 325 275)"/><text x="550" y="340" font-size="24" fill="#38794c" text-anchor="middle" font-weight="normal">Lymphatic route</text><path d="M440,335 L277.0,325.7" fill="none" stroke="#38794c" stroke-width="4"/><path d="M 265 325 l -16 -9 l 0 18 Z" fill="#38794c" transform="rotate(-176.7 265 325)"/><text x="400" y="414" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Sugars and amino acids → blood; fats → lymph</text></g></svg>