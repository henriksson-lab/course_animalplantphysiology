<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Foregut versus hindgut fermentation</title><desc id="desc">The microbial fermentation chamber occurs before the small intestine in a foregut model and after it in a hindgut model. The order changes access to microbial products and biomass.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker></defs><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="26" fill="#26343c" text-anchor="middle" font-weight="bold">Location changes what can be recovered</text><text x="90" y="86" font-size="25" fill="#26343c" text-anchor="start" font-weight="normal">Foregut</text><path d="M95,150 H710" fill="none" stroke="#246b83" stroke-width="18"/><ellipse cx="220" cy="150" rx="95" ry="54" fill="#e8efd8" stroke="#38794c" stroke-width="3"/><text x="220" y="143" font-size="22" fill="#38794c" text-anchor="middle" font-weight="normal">Microbial</text><text x="220" y="170" font-size="22" fill="#38794c" text-anchor="middle" font-weight="normal">fermentation</text><rect x="445" y="115" width="170" height="70" rx="8" fill="#e9f2f5" stroke="#246b83" stroke-width="3"/><text x="530" y="145" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Small</text><text x="530" y="172" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">intestine</text><path d="M710,150 L743.0,150.0" fill="none" stroke="#246b83" stroke-width="4"/><path d="M 755 150 l -16 -9 l 0 18 Z" fill="#246b83" transform="rotate(0.0 755 150)"/><text x="90" y="246" font-size="25" fill="#26343c" text-anchor="start" font-weight="normal">Hindgut</text><path d="M95,310 H710" fill="none" stroke="#246b83" stroke-width="18"/><ellipse cx="530" cy="310" rx="95" ry="54" fill="#e8efd8" stroke="#38794c" stroke-width="3"/><text x="530" y="303" font-size="22" fill="#38794c" text-anchor="middle" font-weight="normal">Microbial</text><text x="530" y="330" font-size="22" fill="#38794c" text-anchor="middle" font-weight="normal">fermentation</text><rect x="135" y="275" width="170" height="70" rx="8" fill="#e9f2f5" stroke="#246b83" stroke-width="3"/><text x="220" y="305" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Small</text><text x="220" y="332" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">intestine</text><path d="M710,310 L743.0,310.0" fill="none" stroke="#246b83" stroke-width="4"/><path d="M 755 310 l -16 -9 l 0 18 Z" fill="#246b83" transform="rotate(0.0 755 310)"/><text x="400" y="416" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Both absorb fermentation products; microbial-cell recovery differs.</text></g></svg>