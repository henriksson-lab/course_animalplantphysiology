<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The same energy transferred over different times</title><desc id="desc">Both events transfer 60 joules. The short event lasts 10 seconds and averages 6 watts; the long event lasts 60 seconds and averages 1 watt. Bar lengths show elapsed time rather than energy.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker></defs><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="34" font-size="26" fill="#26343c" text-anchor="middle" font-weight="bold">Equal energy, different rates</text><text x="100" y="100" font-size="26" fill="#a64836" text-anchor="start" font-weight="normal">60 J in 10 s</text><rect x="100" y="135" width="120" height="35" rx="0" fill="#a64836" stroke="#a64836" stroke-width="3"/><text x="725" y="163" font-size="27" fill="#a64836" text-anchor="middle" font-weight="normal">6 W</text><path d="M100,195 H700" fill="none" stroke="#9ba7ad" stroke-width="2"/><path d="M100,190 V200" fill="none" stroke="#26343c" stroke-width="2"/><path d="M200,190 V200" fill="none" stroke="#26343c" stroke-width="2"/><path d="M300,190 V200" fill="none" stroke="#26343c" stroke-width="2"/><path d="M400,190 V200" fill="none" stroke="#26343c" stroke-width="2"/><path d="M500,190 V200" fill="none" stroke="#26343c" stroke-width="2"/><path d="M600,190 V200" fill="none" stroke="#26343c" stroke-width="2"/><path d="M700,190 V200" fill="none" stroke="#26343c" stroke-width="2"/><text x="100" y="255" font-size="26" fill="#246b83" text-anchor="start" font-weight="normal">60 J in 60 s</text><rect x="100" y="290" width="600" height="35" rx="0" fill="#246b83" stroke="#246b83" stroke-width="3"/><text x="725" y="318" font-size="27" fill="#246b83" text-anchor="middle" font-weight="normal">1 W</text><path d="M100,350 H700" fill="none" stroke="#9ba7ad" stroke-width="2"/><path d="M100,345 V355" fill="none" stroke="#26343c" stroke-width="2"/><path d="M200,345 V355" fill="none" stroke="#26343c" stroke-width="2"/><path d="M300,345 V355" fill="none" stroke="#26343c" stroke-width="2"/><path d="M400,345 V355" fill="none" stroke="#26343c" stroke-width="2"/><path d="M500,345 V355" fill="none" stroke="#26343c" stroke-width="2"/><path d="M600,345 V355" fill="none" stroke="#26343c" stroke-width="2"/><path d="M700,345 V355" fill="none" stroke="#26343c" stroke-width="2"/><text x="400" y="397" font-size="23" fill="#26343c" text-anchor="middle" font-weight="normal">Bar length shows time: 0 → 60 seconds</text><text x="400" y="432" font-size="24" fill="#26343c" text-anchor="middle" font-weight="bold">Power = energy / time; 1 W = 1 J s⁻¹</text></g></svg>