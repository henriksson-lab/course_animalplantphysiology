<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Digestion and absorption are different processes</title><desc id="desc">Food moves through a continuous gut lumen. Absorption crosses the epithelium to internal blood or lymph, while unabsorbed material remains in the lumen and leaves as faeces.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker></defs><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="26" fill="#26343c" text-anchor="middle" font-weight="bold">Follow material across a boundary</text><path d="M65,115 H710" fill="none" stroke="#246b83" stroke-width="70"/><path d="M65,115 H710" fill="none" stroke="#f4e3c4" stroke-width="58"/><text x="400" y="123" font-size="25" fill="#26343c" text-anchor="middle" font-weight="normal">Gut lumen: food → digestion products</text><text x="400" y="77" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Still connected to the external environment</text><path d="M680,115 L755,115" fill="none" stroke="#a64836" stroke-width="4" marker-end="url(#arrow)"/><text x="700" y="177" font-size="22" fill="#a64836" text-anchor="middle" font-weight="normal">Faeces</text><path d="M315,151 L315,255" fill="none" stroke="#246b83" stroke-width="4" marker-end="url(#arrow)"/><text x="190" y="218" font-size="24" fill="#246b83" text-anchor="middle" font-weight="normal">Absorption</text><rect x="130" y="280" width="530" height="55" rx="10" fill="#f5dedb" stroke="#a64836" stroke-width="3"/><text x="395" y="317" font-size="24" fill="#a64836" text-anchor="middle" font-weight="normal">Internal transport: blood / lymph</text><path d="M530,340 L530,380" fill="none" stroke="#38794c" stroke-width="4" marker-end="url(#arrow)"/><text x="285" y="408" font-size="23" fill="#38794c" text-anchor="middle" font-weight="normal">Cells: metabolism, maintenance and growth</text></g></svg>