 <title>Flow rises with the fourth power of radius</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Flow rises with the fourth power of radius</dc:title>
    <dc:description>At constant pressure, flow is proportional to radius to the fourth power: halving the radius gives one sixteenth of the flow and widening it by 19 percent doubles the flow.</dc:description>
    <dc:format>image/svg+xml</dc:format>
   </cc:Work>
  </rdf:RDF>
 </metadata>
