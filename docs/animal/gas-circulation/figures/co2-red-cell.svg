<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Carbon dioxide handling by a red blood cell</title><desc id="desc">CO2 from a tissue cell enters a red blood cell, where carbonic anhydrase converts it with water to H+ and bicarbonate. Bicarbonate leaves in exchange for chloride; H+ binds haemoglobin and helps it release O2.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="26" fill="#243645" text-anchor="middle" font-weight="bold">In tissue capillaries: CO₂ becomes bicarbonate</text><rect x="40" y="70" width="150" height="300" rx="10" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="115" y="205" font-size="24" fill="#397646" text-anchor="middle" font-weight="normal">Tissue</text><text x="115" y="235" font-size="24" fill="#397646" text-anchor="middle" font-weight="normal">cell</text><ellipse cx="470" cy="220" rx="225" ry="150" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="470" y="100" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">Red blood cell</text><line x1="195" y1="150" x2="290" y2="150" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 290 150 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(0.0 290 150)"/><text x="242" y="135" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">CO₂</text><text x="300" y="158" font-size="24" fill="#243645" text-anchor="start" font-weight="normal">CO₂ + H₂O</text><line x1="425" y1="150" x2="490" y2="150" stroke="#b37a22" stroke-width="3" stroke-dasharray=""/><path d="M 490 150 l -14 -8 l 0 16 Z" fill="#b37a22" transform="rotate(0.0 490 150)"/><text x="457" y="130" font-size="20" fill="#b37a22" text-anchor="middle" font-weight="bold">CA</text><text x="500" y="158" font-size="24" fill="#243645" text-anchor="start" font-weight="normal">H⁺ + HCO₃⁻</text><line x1="530" y1="170" x2="530" y2="225" stroke="#243645" stroke-width="3" stroke-dasharray=""/><path d="M 530 225 l -14 -8 l 0 16 Z" fill="#243645" transform="rotate(90.0 530 225)"/><text x="540" y="255" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">H⁺ binds Hb,</text><text x="540" y="283" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">which releases O₂</text><line x1="420" y1="300" x2="200" y2="300" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 200 300 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(180.0 200 300)"/><text x="300" y="335" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">O₂ to tissue</text><line x1="685" y1="175" x2="785" y2="175" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 785 175 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(0.0 785 175)"/><text x="740" y="155" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">HCO₃⁻</text><line x1="785" y1="245" x2="690" y2="245" stroke="#397646" stroke-width="3" stroke-dasharray=""/><path d="M 690 245 l -14 -8 l 0 16 Z" fill="#397646" transform="rotate(180.0 690 245)"/><text x="745" y="275" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">Cl⁻</text><text x="400" y="410" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">CA = carbonic anhydrase.  In the lung all steps run in reverse.</text></g></svg>
