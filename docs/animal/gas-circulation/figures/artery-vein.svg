<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Artery, vein and capillary in cross-section</title><desc id="desc">An artery has a thick round wall of smooth muscle with an elastic layer; the vein beside it has a thin wall and a wider, flattened lumen; a capillary is a single endothelial cell around a lumen the width of one red cell.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="26" fill="#243645" text-anchor="middle" font-weight="bold">Same flow, different pressure, different wall</text><circle cx="190" cy="200" r="120" fill="#e7b9b0" stroke="#b64853" stroke-width="3"/><circle cx="190" cy="200" r="62" fill="white" stroke="#b64853" stroke-width="3"/><path d="M258.0 200.0 L261.5 206.3 L259.6 212.3 L254.0 217.1 L250.2 221.9 L250.6 228.3 L251.6 235.6 L248.5 241.0 L241.6 243.3 L235.3 245.3 L232.3 250.4 L230.4 257.6 L225.9 262.2 L218.9 262.0 L212.0 260.6 L206.8 262.8 L202.0 268.3 L196.3 271.7 L190.0 269.5 L184.3 264.9 L178.8 263.4 L172.3 265.9 L165.4 267.5 L160.2 263.9 L157.0 257.2 L153.3 252.5 L146.8 251.4 L139.6 250.4 L135.4 245.8 L135.1 238.5 L134.5 232.0 L130.1 227.9 L123.7 224.1 L120.7 218.6 L122.9 211.8 L125.9 205.6 L124.8 200.0 L120.6 193.9 L119.1 187.5 L123.1 182.1 L129.0 177.8 L131.5 172.7 L130.6 165.7 L131.1 158.8 L136.2 154.8 L143.5 153.5 L148.8 150.9 L151.3 144.8 L154.3 138.1 L159.9 135.6 L167.2 137.2 L173.4 138.2 L178.5 134.7 L183.8 129.5 L190.0 128.3 L195.9 132.4 L201.2 136.7 L206.9 136.9 L213.9 134.3 L220.4 134.8 L224.5 140.2 L227.1 147.0 L231.5 150.5 L238.7 151.3 L245.1 153.8 L247.4 159.8 L246.8 167.2 L248.2 172.9 L253.6 176.9 L259.2 181.5 L259.9 187.7 L256.3 194.2 L254.0 200.0" fill="none" stroke="#b37a22" stroke-width="3" stroke-linejoin="round"/><text x="190" y="360" font-size="26" fill="#b64853" text-anchor="middle" font-weight="bold">Artery</text><text x="190" y="392" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">thick wall: smooth muscle</text><text x="190" y="420" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">and elastic tissue; round</text><ellipse cx="560" cy="185" rx="150" ry="88" fill="#eaf3f5" stroke="#267a91" stroke-width="12"/><ellipse cx="560" cy="185" rx="138" ry="76" fill="white" stroke="none"/><text x="560" y="335" font-size="26" fill="#267a91" text-anchor="middle" font-weight="bold">Vein</text><text x="560" y="367" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">thin wall, wide lumen;</text><text x="560" y="395" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">often collapsed in a section</text><circle cx="735" cy="300" r="14" fill="white" stroke="#397646" stroke-width="4"/><circle cx="735" cy="300" r="5" fill="#d9534f" stroke="#d9534f" stroke-width="1"/><text x="735" y="266" font-size="20" fill="#397646" text-anchor="middle" font-weight="normal">Capillary</text><text x="735" y="342" font-size="20" fill="#397646" text-anchor="middle" font-weight="normal">1 cell thick</text></g></svg>
