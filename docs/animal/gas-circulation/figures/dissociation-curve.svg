 <title>The O2-haemoglobin dissociation curve</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>The O2-haemoglobin dissociation curve</dc:title>
    <dc:description>Sigmoid Hill curve with n 2.7 and P50 3.5 kPa. Arterial blood at 13.3 kPa is 97 percent saturated, mixed venous blood at 5.3 kPa is 75 percent, and venous blood from exercising muscle at 2.7 kPa is about 33 percent.</dc:description>
    <dc:format>image/svg+xml</dc:format>
   </cc:Work>
  </rdf:RDF>
