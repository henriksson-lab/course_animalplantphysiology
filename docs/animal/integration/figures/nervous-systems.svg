<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Three ways to organise a nervous system</title><desc id="desc">Hydra has a diffuse nerve net and no brain. An earthworm has cerebral ganglia at the front and a ventral nerve cord with a ganglion in each segment. A vertebrate has a brain and a dorsal hollow spinal cord.</desc><g font-family="Arial, sans-serif"><rect x="5" y="5" width="255" height="430" rx="12" fill="#f4f5f6" stroke="none" stroke-width="0"/><rect x="272" y="5" width="255" height="430" rx="12" fill="#f4f5f6" stroke="none" stroke-width="0"/><rect x="539" y="5" width="256" height="430" rx="12" fill="#f4f5f6" stroke="none" stroke-width="0"/><text x="132" y="40" font-size="24" fill="#243645" text-anchor="middle" font-weight="bold">Hydra</text><text x="400" y="40" font-size="24" fill="#243645" text-anchor="middle" font-weight="bold">Earthworm</text><text x="667" y="40" font-size="24" fill="#243645" text-anchor="middle" font-weight="bold">Vertebrate</text><path d="M95 310 L 95 140 C 95 120, 170 120, 170 140 L 170 310 Z" fill="#eaf3f5" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><path d="M105 128 C 80 80, 60 90, 45 70" fill="none" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><path d="M125 122 C 120 80, 110 70, 115 55" fill="none" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><path d="M150 124 C 160 80, 180 80, 200 65" fill="none" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><path d="M165 132 C 200 110, 220 120, 235 105" fill="none" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><line x1="106.30467325632408" y1="144.44432447923003" x2="130.54481539654952" y2="145.16961179123373" stroke="#397646" stroke-width="2" st