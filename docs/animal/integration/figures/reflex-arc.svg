<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The knee-jerk reflex arc</title><desc id="desc">A tap stretches the quadriceps; its muscle spindle excites a sensory neuron, which synapses once in the spinal cord on a motor neuron that makes the quadriceps contract. An inhibitory interneuron relaxes the hamstrings.</desc><g font-family="Arial, sans-serif"><ellipse cx="250" cy="260" rx="190" ry="36" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="290" y="268" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">5 quadriceps contracts</text><ellipse cx="250" cy="360" rx="190" ry="30" fill="#f4f5f6" stroke="#243645" stroke-width="3"/><text x="250" y="368" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">hamstrings relax</text><path d="M440 260 L 500 260" fill="none" stroke="#243645" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><line x1="525" y1="312" x2="480" y2="272" stroke="#243645" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 480 272 l -14.0 -8.0 l 0 16.0 Z" fill="#243645" transform="rotate(-138.4 480 272)"/><text x="520" y="335" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">tap</text><ellipse cx="650" cy="130" rx="110" ry="80" fill="#f4f5f6" stroke="#243645" stroke-width="3"/><path d="M575 105 C 610 70, 690 70, 725 105 C 705 130, 705 150, 725 170 C 690 200, 610 200, 575 170 C 595 150, 595 130, 575 105 Z" fill="#dfe3e6" stroke="#243645" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><text x="650" y="32" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">3 spinal cord: one synapse</text><rect x="80" y="250" width="40" height="20" rx="8" fill="#b37a22" stroke="#b37a22" stroke-width="3"/><text x="40" y="205" font-size="22" fill="#b37a22" text-anchor="start" font-weight="normal">1 muscle spindle</text><path d="M120 258 C 300 190, 380 70, 470 62 L 625 110" fill="none" stroke="#267a91" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><circle cx="470" cy="62" r="13" fill="#267a91" stroke="#267a91" stroke-width="3"/><text x="330" y="110" font-size="22" fill="#267a91" text-anchor="end" font-weight="normal">2 sensory</text><text x="330" y="136" font-size="22" fill="#267a91" text-anchor="end" font-weight="normal">neuron</text><circle cx="628" cy="112" r="6" fill="#267a91" stroke="#267a91" stroke-width="3"/><circle cx="640" cy="135" r="13" fill="#397646" stroke="#397646" stroke-width="3"/><path d="M640 135 C 600 230, 520 250, 410 250" fill="none" stroke="#397646" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><text x="520" y="212" font-size="22" fill="#397646" text-anchor="end" font-weight="normal">4 motor neuron</text><circle cx="680" cy="155" r="9" fill="#b64853" stroke="#b64853" stroke-width="3"/><line x1="632" y1="116" x2="680" y2="155" stroke="#b64853" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><circle cx="700" cy="175" r="11" fill="#243645" stroke="#243645" stroke-width="3"/><path d="M700 175 C 700 260, 620 355, 440 358" fill="none" stroke="#243645" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/><text x="790" y="330" font-size="22" fill="#b64853" text-anchor="end" font-weight="normal">inhibitory</text><text x="790" y="356" font-size="22" fill="#b64853" text-anchor="end" font-weight="normal">interneuron</text></g></svg>
