<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Steps of chemical synaptic transmission</title><desc id="desc">A spike reaches the presynaptic terminal, Ca2+ channels open and Ca2+ enters, vesicles fuse and release transmitter, transmitter crosses the cleft and binds receptors, postsynaptic channels open, and the transmitter is removed.</desc><g font-family="Arial, sans-serif"><rect x="365" y="0" width="70" height="60" rx="0" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><path d="M365 55 C 170 70, 160 225, 215 228 L 585 228 C 640 225, 630 70, 435 55" fill="#eaf3f5" stroke="#267a91" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><line x1="400" y1="5" x2="400" y2="50" stroke="#b64853" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 400 50 l -14.0 -8.0 l 0 16.0 Z" fill="#b64853" transform="rotate(90.0 400 50)"/><text x="450" y="32" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">1 spike arrives</text><circle cx="290" cy="125" r="17" fill="white" stroke="#b37a22" stroke-width="3"/><circle cx="285" cy="121" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="295" cy="122" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="290" cy="131" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="345" cy="170" r="17" fill="white" stroke="#b37a22" stroke-width="3"/><circle cx="340" cy="166" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="350" cy="167" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="345" cy="176" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="420" cy="110" r="17" fill="white" stroke="#b37a22" stroke-width="3"/><circle cx="415" cy="106" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="425" cy="107" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="420" cy="116" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="480" cy="160" r="17" fill="white" stroke="#b37a22" stroke-width="3"/><circle cx="475" cy="156" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="485" cy="157" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="480" cy="166" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="530" cy="120" r="17" fill="white" stroke="#b37a22" stroke-width="3"/><circle cx="525" cy="116" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="535" cy="117" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="530" cy="126" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="285" cy="185" r="17" fill="white" stroke="#b37a22" stroke-width="3"/><circle cx="280" cy="181" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="290" cy="182" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="285" cy="191" r="3" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><path d="M380 228 A 20 20 0 0 1 420 228" fill="none" stroke="#b37a22" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><circle cx="392" cy="238" r="3.5" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="405" cy="244" r="3.5" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="418" cy="237" r="3.5" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="385" cy="247" r="3.5" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="412" cy="251" r="3.5" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><circle cx="398" cy="252" r="3.5" fill="#b37a22" stroke="#b37a22" stroke-width="1"/><rect x="202" y="175" width="20" height="30" rx="3" fill="#b64853" stroke="#b64853" stroke-width="3"/><line x1="142" y1="210" x2="207" y2="192" stroke="#b64853" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 207 192 l -14.0 -8.0 l 0 16.0 Z" fill="#b64853" transform="rotate(-15.5 207 192)"/><rect x="578" y="175" width="20" height="30" rx="3" fill="#b64853" stroke="#b64853" stroke-width="3"/><line x1="658" y1="210" x2="593" y2="192" stroke="#b64853" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 593 192 l -14.0 -8.0 l 0 16.0 Z" fill="#b64853" transform="rotate(-164.5 593 192)"/><text x="10" y="110" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">2 Ca²⁺ channels</text><text x="10" y="136" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">open; 3 Ca²⁺</text><text x="10" y="162" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">enters</text><text x="790" y="110" font-size="22" fill="#b37a22" text-anchor="end" font-weight="normal">4 vesicles fuse:</text><text x="790" y="136" font-size="22" fill="#b37a22" text-anchor="end" font-weight="normal">exocytosis</text><rect x="120" y="262" width="560" height="80" rx="10" fill="#e4efdf" stroke="#397646" stroke-width="3"/><text x="10" y="255" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">cleft</text><rect x="341" y="254" width="18" height="20" rx="3" fill="#397646" stroke="#397646" stroke-width="3"/><rect x="391" y="254" width="18" height="20" rx="3" fill="#397646" stroke="#397646" stroke-width="3"/><rect x="441" y="254" width="18" height="20" rx="3" fill="#397646" stroke="#397646" stroke-width="3"/><line x1="400" y1="280" x2="400" y2="330" stroke="#397646" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 400 330 l -14.0 -8.0 l 0 16.0 Z" fill="#397646" transform="rotate(90.0 400 330)"/><text x="540" y="310" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">6 channels open</text><text x="400" y="380" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">5 transmitter diffuses and binds receptors</text><text x="400" y="420" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">7 removed: acetylcholinesterase or reuptake</text></g></svg>
