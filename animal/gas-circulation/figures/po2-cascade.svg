 <title>The oxygen partial-pressure cascade</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>The oxygen partial-pressure cascade</dc:title>
    <dc:description>PO2 falls stepwise from 21.2 kPa in dry air to 13.3 in alveolar air, about 13 in arterial blood, 5.3 in mixed venous blood and below 1 kPa in mitochondria.</dc:description>
    <dc:format>image/svg+xml</dc:format>
   </cc:Work>
  </rdf:RDF>
 </metadata>
