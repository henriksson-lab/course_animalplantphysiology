<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The mammalian double circulation</title><desc id="desc">The right heart pumps O2-poor blood through the pulmonary arteries to the lung capillaries; pulmonary veins return O2-rich blood to the left heart, which pumps it through the aorta to the body capillaries; veins return it to the right heart.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="26" fill="#243645" text-anchor="middle" font-weight="bold">Two circuits in series, one heart</text><rect x="250" y="55" width="300" height="70" rx="30" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="400" y="98" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Lung capillaries</text><rect x="250" y="330" width="300" height="70" rx="30" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="400" y="373" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Body capillaries</text><rect x="255" y="175" width="130" height="110" rx="14" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="320" y="222" font-size="24" fill="#267a91" text-anchor="middle" font-weight="bold">Right</text><text x="320" y="252" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">heart</text><rect x="415" y="175" width="130" height="110" rx="14" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="480" y="222" font-size="24" fill="#b64853" text-anchor="middle" font-weight="bold">Left</text><text x="480" y="252" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">heart</text><path d="M290 175 C 230 160 200 120 245 95" fill="none" stroke="#267a91" stroke-width="5" stroke-linejoin="round"/><line x1="240" y1="100" x2="252" y2="92" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 252 92 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(-33.7 252 92)"/><path d="M555 92 C 610 110 600 160 548 178" fill="none" stroke="#b64853" stroke-width="5" stroke-linejoin="round"/><line x1="556" y1="172" x2="547" y2="178" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 547 178 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(146.3 547 178)"/><path d="M520 285 C 600 300 600 340 555 362" fill="none" stroke="#b64853" stroke-width="5" stroke-linejoin="round"/><line x1="562" y1="358" x2="551" y2="364" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 551 364 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(151.4 551 364)"/><path d="M248 362 C 200 340 200 300 252 282" fill="none" stroke="#267a91" stroke-width="5" stroke-linejoin="round"/><line x1="245" y1="286" x2="255" y2="281" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 255 281 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(-26.6 255 281)"/><text x="160" y="150" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">Pulmonary</text><text x="160" y="178" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">arteries</text><text x="650" y="140" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">Pulmonary</text><text x="650" y="168" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">veins</text><text x="655" y="315" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">Aorta,</text><text x="655" y="343" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">arteries</text><text x="140" y="318" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">Veins,</text><text x="140" y="346" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">venae cavae</text><text x="400" y="430" font-size="21" fill="#243645" text-anchor="middle" font-weight="normal">O₂-poor blood in blue, O₂-rich in red; arteries leave the heart</text></g></svg>
