<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The route of oxygen from air to mitochondrion</title><desc id="desc">Oxygen moves by ventilation (bulk flow) to the alveolus, diffuses into the lung capillary, is carried by the circulation (bulk flow) to a muscle capillary and diffuses to the mitochondrion.</desc><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="34" font-size="26" fill="#243645" text-anchor="middle" font-weight="bold">Bulk flow and diffusion alternate</text><circle cx="80" cy="175" r="56" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="80" y="183" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Air</text><circle cx="240" cy="175" r="56" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="240" y="183" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Alveolus</text><circle cx="400" cy="175" r="56" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="400" y="170" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Lung</text><text x="400" y="198" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">capillary</text><circle cx="560" cy="175" r="56" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><text x="560" y="170" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Muscle</text><text x="560" y="198" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">capillary</text><circle cx="720" cy="175" r="56" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="720" y="170" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Mito-</text><text x="720" y="198" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">chondrion</text><line x1="138" y1="175" x2="180" y2="175" stroke="#267a91" stroke-width="4" stroke-dasharray=""/><path d="M 180 175 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(0.0 180 175)"/><text x="160.0" y="280" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">Ventilation</text><text x="160.0" y="308" font-size="22" fill="#267a91" text-anchor="middle" font-weight="bold">bulk flow</text><line x1="298" y1="175" x2="340" y2="175" stroke="#b37a22" stroke-width="3" stroke-dasharray=""/><path d="M 340 175 l -14 -8 l 0 16 Z" fill="#b37a22" transform="rotate(0.0 340 175)"/><text x="320.0" y="320" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="normal">Across ~0.5 µm</text><text x="320.0" y="348" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="bold">diffusion</text><line x1="458" y1="175" x2="500" y2="175" stroke="#b64853" stroke-width="4" stroke-dasharray=""/><path d="M 500 175 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(0.0 500 175)"/><text x="480.0" y="280" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">Circulation</text><text x="480.0" y="308" font-size="22" fill="#b64853" text-anchor="middle" font-weight="bold">bulk flow</text><line x1="618" y1="175" x2="660" y2="175" stroke="#b37a22" stroke-width="3" stroke-dasharray=""/><path d="M 660 175 l -14 -8 l 0 16 Z" fill="#b37a22" transform="rotate(0.0 660 175)"/><text x="640.0" y="320" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="normal">Across a few µm</text><text x="640.0" y="348" font-size="22" fill="#b37a22" text-anchor="middle" font-weight="bold">diffusion</text><line x1="70" y1="368" x2="730" y2="368" stroke="#8b969d" stroke-width="2" stroke-dasharray=""/><text x="400" y="405" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Bulk flow: driven by total pressure, needs a pump</text><text x="400" y="433" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">Diffusion: driven by partial pressure, only over µm</text></g></svg>
