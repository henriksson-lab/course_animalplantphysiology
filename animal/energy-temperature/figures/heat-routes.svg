<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Routes of heat exchange</title><desc id="desc">An animal on a rock gains heat by radiation from the sun and by conduction from the warm rock; wind removes heat by convection and evaporation from the body surface removes heat.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker></defs><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="26" fill="#26343c" text-anchor="middle" font-weight="bold">Heat moves by four routes</text><circle cx="95" cy="95" r="38" fill="#f8e7c2" stroke="#b57c22" stroke-width="2"/><path d="M143,95 L157,95" fill="none" stroke="#b57c22" stroke-width="3"/><path d="M129,129 L139,139" fill="none" stroke="#b57c22" stroke-width="3"/><path d="M95,143 L95,157" fill="none" stroke="#b57c22" stroke-width="3"/><path d="M61,129 L51,139" fill="none" stroke="#b57c22" stroke-width="3"/><path d="M47,95 L33,95" fill="none" stroke="#b57c22" stroke-width="3"/><path d="M61,61 L51,51" fill="none" stroke="#b57c22" stroke-width="3"/><path d="M95,47 L95,33" fill="none" stroke="#b57c22" stroke-width="3"/><path d="M129,61 L139,51" fill="none" stroke="#b57c22" stroke-width="3"/><path d="M150,130 L279.3,194.6" fill="none" stroke="#b57c22" stroke-width="4"/><path d="M 290 200 l -16 -9 l 0 18 Z" fill="#b57c22" transform="rotate(26.6 290 200)"/><text x="115" y="190" font-size="24" fill="#b57c22" text-anchor="middle" font-weight="bold">Radiation</text><path d="M120,330 Q400,250 680,330 Z" fill="#d9d4cc" stroke="#26343c" stroke-width="3"/><ellipse cx="400" cy="250" rx="170" ry="48" fill="#e9f2f5" stroke="#246b83" stroke-width="3"/><ellipse cx="590" cy="232" rx="42" ry="26" fill="#e9f2f5" stroke="#246b83" stroke-width="3"/><text x="400" y="258" font-size="24" fill="#246b83" text-anchor="middle" font-weight="normal">Body</text><path d="M400,330 L400.0,314.0" fill="none" stroke="#a64836" stroke-width="4"/><path d="M 400 302 l -16 -9 l 0 18 Z" fill="#a64836" transform="rotate(-90.0 400 302)"/><text x="400" y="365" font-size="24" fill="#a64836" text-anchor="middle" font-weight="bold">Conduction (contact with rock)</text><path d="M640,160 q-20,-10 -40,0 t-40,0 t-40,0" fill="none" stroke="#38794c" stroke-width="3"/><path d="M640,195 q-20,-10 -40,0 t-40,0 t-40,0" fill="none" stroke="#38794c" stroke-width="3"/><path d="M720,178 L652.0,178.0" fill="none" stroke="#38794c" stroke-width="4"/><path d="M 640 178 l -16 -9 l 0 18 Z" fill="#38794c" transform="rotate(180.0 640 178)"/><text x="790" y="135" font-size="24" fill="#38794c" text-anchor="end" font-weight="bold">Convection (wind)</text><path d="M330,195 q8,-12 0,-24 t0,-24 t0,-24" fill="none" stroke="#246b83" stroke-width="3"/><path d="M380,195 q8,-12 0,-24 t0,-24 t0,-24" fill="none" stroke="#246b83" stroke-width="3"/><path d="M430,195 q8,-12 0,-24 t0,-24 t0,-24" fill="none" stroke="#246b83" stroke-width="3"/><text x="380" y="98" font-size="24" fill="#246b83" text-anchor="middle" font-weight="bold">Evaporation</text><text x="400" y="415" font-size="21" fill="#26343c" text-anchor="middle" font-weight="normal">Only evaporation always removes heat; the others can add or remove it.</text></g></svg>