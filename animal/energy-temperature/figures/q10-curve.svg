 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Rate rises exponentially with temperature</dc:title>
    <dc:description>Metabolic rate against temperature for Q10 of 2, 2.5 and 3, through 2.0 at 15 degrees. Between 15 and 25 degrees the measured rate rises from 2.0 to 5.0, a factor of 2.5.</dc:description>
    <dc:format>image/svg+xml</dc:format>
   </cc:Work>
  </rdf:RDF>
