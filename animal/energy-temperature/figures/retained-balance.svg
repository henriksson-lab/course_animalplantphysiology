<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Positive and negative retained energy</title><desc id="desc">After fixed losses, 100 kilojoules remain. Spending 85 leaves plus 15 kilojoules retained; spending 110 produces minus 10, requiring a net contribution from reserves.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker></defs><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="32" font-size="26" fill="#26343c" text-anchor="middle" font-weight="bold">After faecal and excretory losses: 100 kJ</text><path d="M115,350 H710" fill="none" stroke="#26343c" stroke-width="3"/><text x="400" y="420" font-size="24" fill="#26343c" text-anchor="middle" font-weight="normal">Retained energy (kJ over the interval)</text><path d="M350,95 V350" fill="none" stroke="#8d989f" stroke-width="2"/><path d="M150,345 V355" fill="none" stroke="#26343c" stroke-width="2"/><text x="150" y="381" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">−20</text><path d="M350,345 V355" fill="none" stroke="#26343c" stroke-width="2"/><text x="350" y="381" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">0</text><path d="M550,345 V355" fill="none" stroke="#26343c" stroke-width="2"/><text x="550" y="381" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">+20</text><rect x="350" y="125" width="150" height="52" rx="0" fill="#deeddc" stroke="#38794c" stroke-width="3"/><text x="525" y="160" font-size="25" fill="#38794c" text-anchor="start" font-weight="normal">+15</text><text x="130" y="117" font-size="24" fill="#26343c" text-anchor="start" font-weight="normal">85 kJ spent</text><rect x="250" y="240" width="100" height="52" rx="0" fill="#f5dedb" stroke="#a64836" stroke-width="3"/><text x="225" y="275" font-size="25" fill="#a64836" text-anchor="end" font-weight="normal">−10</text><text x="130" y="232" font-size="24" fill="#26343c" text-anchor="start" font-weight="normal">110 kJ spent</text><text x="615" y="185" font-size="22" fill="#38794c" text-anchor="middle" font-weight="normal">Storage gains</text><text x="600" y="313" font-size="22" fill="#a64836" text-anchor="middle" font-weight="normal">Reserves supply</text><text x="600" y="342" font-size="22" fill="#a64836" text-anchor="middle" font-weight="normal">the deficit</text></g></svg>