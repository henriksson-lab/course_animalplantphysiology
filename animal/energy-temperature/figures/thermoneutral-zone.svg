 <title>The thermoneutral zone</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>The thermoneutral zone</dc:title>
    <dc:description>Metabolic rate of an endotherm against ambient temperature. It is minimal and flat in the thermoneutral zone, rises linearly below the lower critical temperature and rises above the upper critical temperature. Thick fur moves the lower critical temperature from 30 to about minus 33 degrees.</dc:description>
    <dc:format>image/svg+xml</dc:format>
   </cc:Work>
  </rdf:RDF>
