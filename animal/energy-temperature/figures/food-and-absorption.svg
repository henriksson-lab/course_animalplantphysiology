<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Food intake and absorption</title><desc id="desc">Two equal-mass food bars contain different proportions of digestible and unabsorbed material. Amount eaten alone does not establish nutrient delivery.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker></defs><rect width="800" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="400" y="34" font-size="26" fill="#26343c" text-anchor="middle" font-weight="bold">Same mass eaten ≠ same nutrients absorbed</text><text x="220" y="88" font-size="26" fill="#26343c" text-anchor="middle" font-weight="normal">Food A</text><rect x="110" y="112" width="220" height="180" rx="0" fill="#246b83" stroke="#246b83" stroke-width="3"/><text x="220" y="210.0" font-size="22" fill="white" text-anchor="middle" font-weight="normal">Digestible</text><rect x="110" y="292" width="220" height="60" rx="0" fill="#d8dce0" stroke="#d8dce0" stroke-width="3"/><text x="220" y="330.0" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Unabsorbed</text><text x="560" y="88" font-size="26" fill="#26343c" text-anchor="middle" font-weight="normal">Food B</text><rect x="450" y="112" width="220" height="110" rx="0" fill="#246b83" stroke="#246b83" stroke-width="3"/><text x="560" y="175.0" font-size="22" fill="white" text-anchor="middle" font-weight="normal">Digestible</text><rect x="450" y="222" width="220" height="130" rx="0" fill="#d8dce0" stroke="#d8dce0" stroke-width="3"/><text x="560" y="295.0" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Unabsorbed</text><text x="400" y="400" font-size="22" fill="#26343c" text-anchor="middle" font-weight="normal">Equal mass eaten; composition and digestibility differ.</text></g></svg>