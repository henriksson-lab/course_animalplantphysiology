    <dc:title>Oxygen falls in a closed respirometer</dc:title>
    <dc:description>O2 concentration in a 0.1 litre chamber falls by 0.40 mg per litre in 10 minutes with an animal inside, and by 0.10 mg per litre in the blank chamber without an animal.</dc:description>
