<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Equilibrium potentials and driving forces at rest</title><desc id="desc">On a voltage scale, rest at -70 mV lies close to E_K (-89 mV) and far from E_Na (+61 mV). The driving force on Na+ is large and inward; on K+ it is small and outward.</desc><g font-family="Arial, sans-serif"><line x1="150" y1="50.0" x2="150" y2="420.0" stroke="#243645" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><text x="150" y="30" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">mV</text><line x1="140" y1="71.76470588235294" x2="150" y2="71.76470588235294" stroke="#243645" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/><text x="132" y="79.76470588235294" font-size="22" fill="#243645" text-anchor="end" font-weight="normal">+60</text><line x1="140" y1="137.05882352941177" x2="150" y2="137.05882352941177" stroke="#243645" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/><text x="132" y="145.05882352941177" font-size="22" fill="#243645" text-anchor="end" font-weight="normal">+30</text><line x1="140" y1="202.35294117647058" x2="150" y2="202.35294117647058" stroke="#243645" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/><text x="132" y="210.35294117647058" font-size="22" fill="#243645" text-anchor="end" font-weight="normal">0</text><line x1="140" y1="267.6470588235294" x2="150" y2="267.6470588235294" stroke="#243645" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/><text x="132" y="275.6470588235294" font-size="22" fill="#243645" text-anchor="end" font-weight="normal">−30</text><line x1="140" y1="332.94117647058823" x2="150" y2="332.94117647058823" stroke="#243645" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/><text x="132" y="340.94117647058823" font-size="22" fill="#243645" text-anchor="end" font-weight="normal">−60</text><line x1="140" y1="398.2352941176471" x2="150" y2="398.2352941176471" stroke="#243645" stroke-width="2" stroke-dasharray="" stroke-linecap="round"/><text x="132" y="406.2352941176471" font-size="22" fill="#243645" text-anchor="end" font-weight="normal">−90</text><line x1="150" y1="69.58823529411765" x2="400" y2="69.58823529411765" stroke="#b64853" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><text x="410" y="77.58823529411765" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">E_Na +61</text><line x1="150" y1="322.05882352941177" x2="400" y2="322.05882352941177" stroke="#243645" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round"/><text x="410" y="330.05882352941177" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">threshold −55</text><line x1="150" y1="354.70588235294116" x2="400" y2="354.70588235294116" stroke="#267a91" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><text x="410" y="368.70588235294116" font-size="22" fill="#267a91" text-anchor="start" font-weight="bold">Vm −70 (rest)</text><line x1="150" y1="396.05882352941177" x2="400" y2="396.05882352941177" stroke="#397646" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><text x="410" y="410.05882352941177" font-size="22" fill="#397646" text-anchor="start" font-weight="normal">E_K −89</text><line x1="250" y1="348.70588235294116" x2="250" y2="75.58823529411765" stroke="#b64853" stroke-width="5" stroke-dasharray="" stroke-linecap="round"/><path d="M 250 75.58823529411765 l -17.5 -10.0 l 0 20.0 Z" fill="#b64853" transform="rotate(-90.0 250 75.58823529411765)"/><text x="258" y="202.35294117647058" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">Na⁺:</text><text x="258" y="228.35294117647058" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">131 mV</text><line x1="330" y1="358.70588235294116" x2="330" y2="392.05882352941177" stroke="#397646" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 330 392.05882352941177 l -14.0 -8.0 l 0 16.0 Z" fill="#397646" transform="rotate(90.0 330 392.05882352941177)"/><rect x="668" y="70" width="24" height="330" rx="4" fill="#b37a22" stroke="#b37a22" stroke-width="3"/><text x="615" y="95" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">outside</text><text x="750" y="95" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">inside</text><line x1="575" y1="180" x2="785" y2="180" stroke="#b64853" stroke-width="12" stroke-dasharray="" stroke-linecap="round"/><path d="M 785 180 l -25.2 -14.4 l 0 28.8 Z" fill="#b64853" transform="rotate(0.0 785 180)"/><text x="620" y="160" font-size="24" fill="#b64853" text-anchor="middle" font-weight="bold">Na⁺ in</text><text x="745" y="225" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">large</text><line x1="785" y1="300" x2="580" y2="300" stroke="#397646" stroke-width="4" stroke-dasharray="" stroke-linecap="round"/><path d="M 580 300 l -14.0 -8.0 l 0 16.0 Z" fill="#397646" transform="rotate(180.0 580 300)"/><text x="745" y="285" font-size="24" fill="#397646" text-anchor="middle" font-weight="bold">K⁺ out</text><text x="620" y="335" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">small</text><text x="610" y="432" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">driving force = Vm − E_ion</text></g></svg>
