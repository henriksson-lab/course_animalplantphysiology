<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The male hypothalamic-pituitary-gonadal axis</title><desc id="desc">GnRH from the hypothalamus stimulates LH and FSH release from the anterior pituitary. LH drives testosterone from Leydig cells; FSH acts on Sertoli cells. Testosterone inhibits the hypothalamus and pituitary; inhibin inhibits FSH release.</desc><g font-family="Arial, sans-serif"><rect x="220" y="20" width="260" height="62" rx="10" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="350" y="60" font-size="24" fill="#267a91" text-anchor="middle" font-weight="bold">Hypothalamus</text><rect x="220" y="140" width="260" height="62" rx="10" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><text x="350" y="180" font-size="24" fill="#267a91" text-anchor="middle" font-weight="bold">Anterior pituitary</text><rect x="80" y="270" width="230" height="62" rx="10" fill="#e4efdf" stroke="#397646" stroke-width="3"/><text x="195" y="310" font-size="24" fill="#397646" text-anchor="middle" font-weight="bold">Leydig cells</text><rect x="390" y="270" width="230" height="62" rx="10" fill="#e4efdf" stroke="#397646" stroke-width="3"/><text x="505" y="310" font-size="24" fill="#397646" text-anchor="middle" font-weight="bold">Sertoli cells</text><line x1="350" y1="84" x2="350" y2="136" stroke="#243645" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 350 136 l -14.0 -8.0 l 0 16.0 Z" fill="#243645" transform="rotate(90.0 350 136)"/><text x="362" y="118" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">GnRH</text><line x1="290" y1="204" x2="220" y2="266" stroke="#243645" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 220 266 l -14.0 -8.0 l 0 16.0 Z" fill="#243645" transform="rotate(138.5 220 266)"/><text x="262" y="248" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">LH</text><line x1="410" y1="204" x2="480" y2="266" stroke="#243645" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 480 266 l -14.0 -8.0 l 0 16.0 Z" fill="#243645" transform="rotate(41.5 480 266)"/><text x="470" y="236" font-size="22" fill="#243645" text-anchor="start" font-weight="normal">FSH</text><line x1="195" y1="334" x2="300" y2="392" stroke="#397646" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 300 392 l -14.0 -8.0 l 0 16.0 Z" fill="#397646" transform="rotate(28.9 300 392)"/><line x1="505" y1="334" x2="400" y2="392" stroke="#397646" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 400 392 l -14.0 -8.0 l 0 16.0 Z" fill="#397646" transform="rotate(151.1 400 392)"/><text x="350" y="425" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">spermatogenesis, male traits</text><path d="M80 300 L 40 300 L 40 51 L 212 51" fill="none" stroke="#b64853" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/><path d="M 214 51 l -14.0 -8.0 l 0 16.0 Z" fill="#b64853" transform="rotate(0.0 214 51)"/><path d="M40 171 L 212 171" fill="none" stroke="#b64853" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/><path d="M 214 171 l -14.0 -8.0 l 0 16.0 Z" fill="#b64853" transform="rotate(0.0 214 171)"/><text x="50" y="245" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">testosterone (−)</text><path d="M620 300 L 680 300 L 680 171 L 488 171" fill="none" stroke="#b64853" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/><path d="M 486 171 l -14.0 -8.0 l 0 16.0 Z" fill="#b64853" transform="rotate(180.0 486 171)"/><text x="690" y="240" font-size="22" fill="#b64853" text-anchor="start" font-weight="normal">inhibin (−)</text></g></svg>
