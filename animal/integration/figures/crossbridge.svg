<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The cross-bridge cycle</title><desc id="desc">ATP binding detaches myosin from actin; ATP hydrolysis re-cocks the head; the head binds an exposed site on actin; phosphate release drives the power stroke. Without ATP the heads stay attached (rigor).</desc><g font-family="Arial, sans-serif"><rect x="255.0" y="17" width="290" height="90" rx="12" fill="white" stroke="#267a91" stroke-width="3"/><text x="400" y="56" font-size="23" fill="#267a91" text-anchor="middle" font-weight="normal">1 ATP binds:</text><text x="400" y="83" font-size="23" fill="#267a91" text-anchor="middle" font-weight="normal">head detaches</text><rect x="540.0" y="165" width="250" height="90" rx="12" fill="white" stroke="#b37a22" stroke-width="3"/><text x="665" y="204" font-size="23" fill="#b37a22" text-anchor="middle" font-weight="normal">2 ATP → ADP + Pᵢ:</text><text x="665" y="231" font-size="23" fill="#b37a22" text-anchor="middle" font-weight="normal">head re-cocked</text><rect x="255.0" y="313" width="290" height="90" rx="12" fill="white" stroke="#397646" stroke-width="3"/><text x="400" y="352" font-size="23" fill="#397646" text-anchor="middle" font-weight="normal">3 head binds actin</text><text x="400" y="379" font-size="23" fill="#397646" text-anchor="middle" font-weight="normal">(site exposed by Ca²⁺)</text><rect x="10.0" y="165" width="250" height="90" rx="12" fill="white" stroke="#b64853" stroke-width="3"/><text x="135" y="204" font-size="23" fill="#b64853" text-anchor="middle" font-weight="normal">4 Pᵢ released:</text><text x="135" y="231" font-size="23" fill="#b64853" text-anchor="middle" font-weight="normal">power stroke</text><line x1="548" y1="70" x2="650" y2="160" stroke="#243645" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 650 160 l -14.0 -8.0 l 0 16.0 Z" fill="#243645" transform="rotate(41.4 650 160)"/><line x1="650" y1="260" x2="548" y2="350" stroke="#243645" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 548 350 l -14.0 -8.0 l 0 16.0 Z" fill="#243645" transform="rotate(138.6 548 350)"/><line x1="252" y1="350" x2="150" y2="260" stroke="#243645" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 150 260 l -14.0 -8.0 l 0 16.0 Z" fill="#243645" transform="rotate(-138.6 150 260)"/><line x1="150" y1="160" x2="252" y2="70" stroke="#243645" stroke-width="3" stroke-dasharray="" stroke-linecap="round"/><path d="M 252 70 l -14.0 -8.0 l 0 16.0 Z" fill="#243645" transform="rotate(-41.4 252 70)"/><text x="400" y="200" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">no ATP: heads</text><text x="400" y="228" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">stay attached</text><text x="400" y="256" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">= rigor</text><text x="400" y="432" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">each power stroke moves actin ~10 nm</text></g></svg>
