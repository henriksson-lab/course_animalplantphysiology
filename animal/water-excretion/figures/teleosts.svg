<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Freshwater and marine teleosts have opposite problems</title><desc id="desc">A freshwater fish gains water and loses salt, so it makes much dilute urine and takes up NaCl at the gills. A marine fish loses water and gains salt, so it drinks, secretes NaCl at the gills and makes little urine.</desc><g font-family="Arial, sans-serif"><rect x="8" y="8" width="386" height="424" rx="14" fill="#eef6fb" stroke="#267a91" stroke-width="2"/><rect x="406" y="8" width="386" height="424" rx="14" fill="#dfeaf2" stroke="#267a91" stroke-width="2"/><text x="200" y="45" font-size="24" fill="#267a91" text-anchor="middle" font-weight="bold">Fresh water ~5 mOsm</text><text x="600" y="45" font-size="24" fill="#267a91" text-anchor="middle" font-weight="bold">Seawater ~1,000 mOsm</text><path d="M110.0 200 L55.0 162.0 L65.0 200 L55.0 238.0 Z" fill="#eaf3f5" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><path d="M105.0 200 C155.0 140.0 275.0 140.0 325.0 200 C275.0 260.0 155.0 260.0 105.0 200 Z" fill="#eaf3f5" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><path d="M267.0 170.0 C253.0 190.0 253.0 210.0 267.0 230.0" fill="none" stroke="#b64853" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><circle cx="295.0" cy="188.0" r="6" fill="#243645" stroke="#243645" stroke-width="1"/><path d="M505.0 200 L450.0 162.0 L460.0 200 L450.0 238.0 Z" fill="#eaf3f5" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><path d="M500.0 200 C550.0 140.0 670.0 140.0 720.0 200 C670.0 260.0 550.0 260.0 500.0 200 Z" fill="#eaf3f5" stroke="#267a91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><path d="M662.0 170.0 C648.0 190.0 648.0 210.0 662.0 230.0" fill="none" stroke="#b64853" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><circle cx="690.0" cy="188.0" r="6" fill="#243645" stroke="#243645" stroke-width="1"/><text x="205" y="207" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">body 300</text><text x="600" y="207" font-size="22" fill="#243645" text-anchor="middle" font-weight="normal">body 350</text><line x1="165" y1="95" x2="165" y2="148" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 165 148 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(90.0 165 148)"/><text x="165" y="85" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">water in</text><line x1="335" y1="125" x2="282" y2="165" stroke="#397646" stroke-width="3" stroke-dasharray=""/><path d="M 282 165 l -14 -8 l 0 16 Z" fill="#397646" transform="rotate(143.0 282 165)"/><text x="320" y="88" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">gills take</text><text x="320" y="114" font-size="22" fill="#397646" text-anchor="middle" font-weight="normal">up NaCl</text><line x1="235" y1="248" x2="262" y2="300" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 262 300 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(62.6 262 300)"/><text x="262" y="330" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">salt leaks out</text><line x1="125" y1="235" x2="125" y2="368" stroke="#b37a22" stroke-width="7" stroke-dasharray=""/><path d="M 125 368 l -14 -8 l 0 16 Z" fill="#b37a22" transform="rotate(90.0 125 368)"/><text x="40" y="400" font-size="22" fill="#b37a22" text-anchor="start" font-weight="normal">lots of dilute urine</text><line x1="560" y1="148" x2="560" y2="95" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 560 95 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(-90.0 560 95)"/><text x="560" y="85" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">water out</text><line x1="772" y1="135" x2="730" y2="185" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 730 185 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(130.0 730 185)"/><text x="772" y="118" font-size="22" fill="#267a91" text-anchor="end" font-weight="normal">drinks</text><line x1="672" y1="225" x2="722" y2="290" stroke="#397646" stroke-width="3" stroke-dasharray=""/><path d="M 722 290 l -14 -8 l 0 16 Z" fill="#397646" transform="rotate(52.4 722 290)"/><text x="785" y="318" font-size="22" fill="#397646" text-anchor="end" font-weight="normal">gills secrete</text><text x="785" y="344" font-size="22" fill="#397646" text-anchor="end" font-weight="normal">NaCl</text><line x1="590" y1="305" x2="605" y2="252" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 605 252 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(-74.2 605 252)"/><text x="545" y="335" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">salt leaks in</text><line x1="522" y1="232" x2="522" y2="368" stroke="#b37a22" stroke-width="2" stroke-dasharray=""/><path d="M 522 368 l -14 -8 l 0 16 Z" fill="#b37a22" transform="rotate(90.0 522 368)"/><text x="440" y="400" font-size="22" fill="#b37a22" text-anchor="start" font-weight="normal">little urine</text></g></svg>
