<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">A polarised transporting epithelial cell</title><desc id="desc">Na+ enters the cell passively across the apical membrane through channels or cotransporters. The basolateral Na+/K+-ATPase pumps 3 Na+ to the blood side and 2 K+ into the cell. Water follows osmotically.</desc><g font-family="Arial, sans-serif"><text x="110" y="40" font-size="26" fill="#243645" text-anchor="middle" font-weight="bold">Lumen</text><text x="690" y="40" font-size="26" fill="#243645" text-anchor="middle" font-weight="bold">Blood side</text><rect x="10" y="60" width="200" height="330" rx="8" fill="#fff4df" stroke="#b37a22" stroke-width="2"/><rect x="590" y="60" width="200" height="330" rx="8" fill="#f5dadd" stroke="#b64853" stroke-width="2"/><rect x="230" y="70" width="340" height="310" rx="30" fill="#eaf3f5" stroke="#267a91" stroke-width="4"/><text x="400" y="120" font-size="26" fill="#267a91" text-anchor="middle" font-weight="bold">Cell</text><text x="400" y="155" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">Na⁺ 15 mmol L⁻¹</text><text x="400" y="190" font-size="23" fill="#243645" text-anchor="middle" font-weight="normal">inside −70 mV</text><text x="110" y="105" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Na⁺ 140</text><text x="690" y="105" font-size="24" fill="#243645" text-anchor="middle" font-weight="normal">Na⁺ 140</text><text x="230" y="422" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">apical membrane</text><text x="570" y="422" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">basolateral</text><rect x="219" y="205" width="22" height="50" rx="4" fill="#b8d9e2" stroke="#267a91" stroke-width="3"/><line x1="70" y1="230" x2="320" y2="230" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 320 230 l -14 -8 l 0 16 Z" fill="#267a91" transform="rotate(0.0 320 230)"/><text x="110" y="275" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">passive:</text><text x="110" y="301" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">channel or</text><text x="110" y="327" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">cotransporter</text><circle cx="570" cy="232" r="28" fill="#b37a22" stroke="#b37a22" stroke-width="3"/><text x="570" y="240" font-size="20" fill="white" text-anchor="middle" font-weight="bold">ATP</text><line x1="480" y1="212" x2="700" y2="212" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 700 212 l -14 -8 l 0 16 Z" fill="#b64853" transform="rotate(0.0 700 212)"/><text x="690" y="195" font-size="23" fill="#b64853" text-anchor="middle" font-weight="normal">3 Na⁺</text><line x1="700" y1="255" x2="605" y2="255" stroke="#397646" stroke-width="3" stroke-dasharray=""/><path d="M 605 255 l -14 -8 l 0 16 Z" fill="#397646" transform="rotate(180.0 605 255)"/><text x="690" y="290" font-size="23" fill="#397646" text-anchor="middle" font-weight="normal">2 K⁺</text><text x="690" y="325" font-size="22" fill="#b64853" text-anchor="middle" font-weight="normal">Na⁺/K⁺-ATPase</text><line x1="30" y1="360" x2="750" y2="360" stroke="#267a91" stroke-width="3" stroke-dasharray="10 7"/><path d="M 768 360 l -18 -9 l 0 18 Z" fill="#267a91"/><text x="400" y="345" font-size="22" fill="#267a91" text-anchor="middle" font-weight="normal">water follows (osmosis)</text></g></svg>
