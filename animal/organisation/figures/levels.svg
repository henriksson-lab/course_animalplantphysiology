<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Cells, tissues and organs</title><desc id="desc">A cell joins a sheet of epithelium. The sheet is one layer in an intestinal wall, part of an organism.</desc><g font-family="Arial, sans-serif"><text x="400" y="35" font-size="25" fill="#243645" text-anchor="middle">One intestinal wall contains several tissues</text><circle cx="90" cy="150" r="40" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="90" cy="150" r="12" fill="#b8d9e2" stroke="#267a91" stroke-width="3"/><text x="90" y="235" font-size="25" fill="#243645" text-anchor="middle">Cell</text><rect x="205" y="117" width="30" height="66" rx="6" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="220" cy="150" r="5" fill="#267a91" stroke="#267a91" stroke-width="3"/><line x1="205" y1="185" x2="235" y2="185" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><rect x="236" y="117" width="30" height="66" rx="6" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="251" cy="150" r="5" fill="#267a91" stroke="#267a91" stroke-width="3"/><line x1="236" y1="185" x2="266" y2="185" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><rect x="267" y="117" width="30" height="66" rx="6" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="282" cy="150" r="5" fill="#267a91" stroke="#267a91" stroke-width="3"/><line x1="267" y1="185" x2="297" y2="185" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><rect x="298" y="117" width="30" height="66" rx="6" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="313" cy="150" r="5" fill="#267a91" stroke="#267a91" stroke-width="3"/><line x1="298" y1="185" x2="328" y2="185" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><rect x="329" y="117" width="30" height="66" rx="6" fill="#eaf3f5" stroke="#267a91" stroke-width="3"/><circle cx="344" cy="150" r="5" fill="#267a91" stroke="#267a91" stroke-width="3"/><line x1="329" y1="185" x2="359" y2="185" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><text x="270" y="235" font-size="25" fill="#243645" text-anchor="middle">Epithelium</text><line x1="140" y1="150" x2="190" y2="150" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 190 150 l -12 -7 l 0 14 Z" fill="#267a91" transform="rotate(0.0 190 150)"/><circle cx="470" cy="150" r="70" fill="#f3e8df" stroke="#b37a22" stroke-width="3"/><circle cx="470" cy="150" r="48" fill="#d6e9df" stroke="#397646" stroke-width="3"/><circle cx="470" cy="150" r="31" fill="white" stroke="#267a91" stroke-width="3"/><text x="470" y="235" font-size="25" fill="#243645" text-anchor="middle">Intestinal wall</text><line x1="345" y1="150" x2="385" y2="150" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 385 150 l -12 -7 l 0 14 Z" fill="#267a91" transform="rotate(0.0 385 150)"/><path d="M650 105 C625 130 625 175 650 200 L710 200 C735 175 735 130 710 105 Z" fill="#f4f5f6" stroke="#243645" stroke-width="4" stroke-linejoin="round"/><path d="M660 130 C700 110 720 150 665 155 C635 175 720 190 700 165" fill="none" stroke="#b64853" stroke-width="4" stroke-linejoin="round"/><text x="680" y="235" font-size="25" fill="#243645" text-anchor="middle">Organism</text><line x1="550" y1="150" x2="615" y2="150" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 615 150 l -12 -7 l 0 14 Z" fill="#267a91" transform="rotate(0.0 615 150)"/><text x="400" y="305" font-size="24" fill="#243645" text-anchor="middle">Epithelium + connective tissue + muscle + nerves</text><text x="400" y="355" font-size="24" fill="#243645" text-anchor="middle">Functions depend on their arrangement and interaction.</text><text x="400" y="410" font-size="22" fill="#243645" text-anchor="middle">Original schematic; not a specimen image</text></g></svg>
