<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">The gut lumen is outside the internal environment</title><desc id="desc">A gut lumen crosses the body boundary. Absorption crosses its epithelial lining into internal fluid and blood.</desc><g font-family="Arial, sans-serif"><rect x="75" y="85" width="650" height="275" rx="35" fill="#f1f5f6" stroke="#243645" stroke-width="3"/><text x="400" y="60" font-size="25" fill="#243645" text-anchor="middle">Body boundary</text><rect x="50" y="130" width="700" height="85" rx="6" fill="#fff4df" stroke="#b37a22" stroke-width="3"/><text x="400" y="178" font-size="25" fill="#243645" text-anchor="middle">Gut lumen: connected to the exterior</text><rect x="85" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="125" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="165" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="205" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="245" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="285" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="325" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="365" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="405" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="445" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="485" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="525" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="565" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="605" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="645" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><rect x="685" y="215" width="39" height="35" rx="0" fill="#d9ebf0" stroke="#267a91" stroke-width="3"/><text x="255" y="282" font-size="23" fill="#243645" text-anchor="middle">Selective epithelium</text><line x1="420" y1="180" x2="420" y2="295" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 420 295 l -12 -7 l 0 14 Z" fill="#267a91" transform="rotate(90.0 420 295)"/><text x="535" y="283" font-size="23" fill="#243645" text-anchor="middle">Absorption</text><rect x="160" y="310" width="480" height="25" rx="6" fill="#f5dadd" stroke="#b64853" stroke-width="3"/><line x1="200" y1="323" x2="590" y2="323" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 590 323 l -12 -7 l 0 14 Z" fill="#b64853" transform="rotate(0.0 590 323)"/><text x="400" y="395" font-size="23" fill="#243645" text-anchor="middle">Interstitial fluid and blood are internal compartments.</text></g></svg>
