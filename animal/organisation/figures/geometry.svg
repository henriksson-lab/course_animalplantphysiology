<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Surface area and volume scale differently</title><desc id="desc">Two cubes have lengths L and 2L. Surface area increases fourfold and volume eightfold, halving their surface-to-volume ratio.</desc><g font-family="Arial, sans-serif"><text x="400" y="25" font-size="25" fill="#243645" text-anchor="middle">Doubling length does not double exchange capacity</text><path d="M105 145 l85 0 l0 85 l-85 0 Z" fill="#d8eaf0" stroke="#267a91" stroke-width="4" stroke-linejoin="round"/><path d="M105 145 l32.3 -32.3 l85 0 l-32.3 32.3 Z" fill="#edf6f8" stroke="#267a91" stroke-width="4" stroke-linejoin="round"/><path d="M190 145 l32.3 -32.3 l0 85 l-32.3 32.3 Z" fill="#b8d7e1" stroke="#267a91" stroke-width="4" stroke-linejoin="round"/><path d="M460 100 l170 0 l0 170 l-170 0 Z" fill="#d8eaf0" stroke="#267a91" stroke-width="4" stroke-linejoin="round"/><path d="M460 100 l64.6 -64.6 l170 0 l-64.6 64.6 Z" fill="#edf6f8" stroke="#267a91" stroke-width="4" stroke-linejoin="round"/><path d="M630 100 l64.6 -64.6 l0 170 l-64.6 64.6 Z" fill="#b8d7e1" stroke="#267a91" stroke-width="4" stroke-linejoin="round"/><text x="155" y="285" font-size="25" fill="#243645" text-anchor="middle">Length L</text><text x="555" y="305" font-size="25" fill="#243645" text-anchor="middle">Length 2L</text><text x="160" y="345" font-size="24" fill="#243645" text-anchor="middle">Area 6L²</text><text x="160" y="375" font-size="24" fill="#243645" text-anchor="middle">Volume L³</text><text x="560" y="345" font-size="24" fill="#243645" text-anchor="middle">Area ×4</text><text x="560" y="375" font-size="24" fill="#243645" text-anchor="middle">Volume ×8</text><text x="400" y="430" font-size="24" fill="#243645" text-anchor="middle">Surface area / volume falls from 6/L to 3/L.</text></g></svg>
