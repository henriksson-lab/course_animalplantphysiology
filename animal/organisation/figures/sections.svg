<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Sectioning changes the apparent shape</title><desc id="desc">A transverse plane through a tube gives a ring, while a longitudinal plane shows two wall profiles separated by a lumen.</desc><g font-family="Arial, sans-serif"><text x="400" y="38" font-size="25" fill="#243645" text-anchor="middle">One tube can produce different section profiles</text><rect x="45" y="110" width="350" height="100" rx="48" fill="#dcebf0" stroke="#267a91" stroke-width="3"/><rect x="45" y="140" width="350" height="40" rx="18" fill="white" stroke="#267a91" stroke-width="3"/><line x1="150" y1="75" x2="150" y2="245" stroke="#b64853" stroke-width="4" stroke-dasharray="8 5"/><line x1="75" y1="161" x2="365" y2="161" stroke="#397646" stroke-width="4" stroke-dasharray="8 5"/><text x="155" y="285" font-size="24" fill="#b64853" text-anchor="middle">Cut across</text><text x="300" y="335" font-size="24" fill="#397646" text-anchor="middle">Cut along</text><line x1="400" y1="125" x2="480" y2="125" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 480 125 l -12 -7 l 0 14 Z" fill="#b64853" transform="rotate(0.0 480 125)"/><circle cx="590" cy="125" r="65" fill="#dcebf0" stroke="#267a91" stroke-width="3"/><circle cx="590" cy="125" r="35" fill="white" stroke="#267a91" stroke-width="3"/><text x="700" y="135" font-size="24" fill="#243645" text-anchor="middle">Ring</text><line x1="400" y1="300" x2="480" y2="300" stroke="#397646" stroke-width="3" stroke-dasharray=""/><path d="M 480 300 l -12 -7 l 0 14 Z" fill="#397646" transform="rotate(0.0 480 300)"/><rect x="510" y="265" width="230" height="18" rx="6" fill="#dcebf0" stroke="#267a91" stroke-width="3"/><rect x="510" y="320" width="230" height="18" rx="6" fill="#dcebf0" stroke="#267a91" stroke-width="3"/><text x="625" y="390" font-size="24" fill="#243645" text-anchor="middle">Two walls + lumen</text><text x="400" y="425" font-size="22" fill="#243645" text-anchor="middle">Orientation changes appearance, not organ identity.</text></g></svg>
