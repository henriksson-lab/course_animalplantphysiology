<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Two transport architectures for oxygen</title><desc id="desc">Insects bring air through branching tracheal tubes near cells. Mammals exchange gases at the lungs and use blood to deliver oxygen to tissues.</desc><g font-family="Arial, sans-serif"><text x="200" y="40" font-size="25" fill="#243645" text-anchor="middle">Insect</text><text x="600" y="40" font-size="25" fill="#243645" text-anchor="middle">Mammal</text><path d="M60 110 L145 110 L200 150 L280 110 M200 150 L280 190 M200 150 L200 235 M200 235 L290 265 M200 235 L120 270" fill="none" stroke="#267a91" stroke-width="4" stroke-linejoin="round"/><text x="75" y="80" font-size="24" fill="#243645" text-anchor="middle">Air</text><line x1="65" y1="125" x2="135" y2="125" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 135 125 l -12 -7 l 0 14 Z" fill="#267a91" transform="rotate(0.0 135 125)"/><circle cx="305" cy="265" r="20" fill="#e2eedf" stroke="#397646" stroke-width="3"/><circle cx="305" cy="190" r="20" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="195" y="340" font-size="24" fill="#243645" text-anchor="middle">Tracheae branch</text><text x="195" y="370" font-size="24" fill="#243645" text-anchor="middle">near tissue cells</text><path d="M500 90 L500 135 M500 135 C440 100 435 225 490 230 L500 145 M500 135 C560 100 565 225 510 230 L500 145" fill="#e4eff3" stroke="#267a91" stroke-width="4" stroke-linejoin="round"/><text x="510" y="75" font-size="24" fill="#243645" text-anchor="middle">Air</text><line x1="555" y1="180" x2="630" y2="180" stroke="#267a91" stroke-width="3" stroke-dasharray=""/><path d="M 630 180 l -12 -7 l 0 14 Z" fill="#267a91" transform="rotate(0.0 630 180)"/><path d="M630 125 L690 125 L690 265 L630 265 Z" fill="none" stroke="#b64853" stroke-width="4" stroke-linejoin="round"/><line x1="690" y1="180" x2="750" y2="180" stroke="#b64853" stroke-width="3" stroke-dasharray=""/><path d="M 750 180 l -12 -7 l 0 14 Z" fill="#b64853" transform="rotate(0.0 750 180)"/><circle cx="770" cy="180" r="20" fill="#e2eedf" stroke="#397646" stroke-width="3"/><text x="600" y="340" font-size="24" fill="#243645" text-anchor="middle">Lungs → blood → cells</text><text x="400" y="410" font-size="23" fill="#243645" text-anchor="middle">Both need a gradient and a short final diffusion path.</text></g></svg>
